name: build

# Vets, tests on both databases, checks that every generated file is what
# its source generates, and builds the images. The apps have their own
# workflow when they exist.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: churr
          POSTGRES_PASSWORD: churr
          POSTGRES_DB: churr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U churr" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal tools imports_test.go | tee /dev/stderr)"
      - name: Builds without cgo
        run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - name: Test with SQLite
        run: go test -count=1 ./...
      - name: Test with PostgreSQL
        # Each test makes a database of its own on this server and drops
        # it afterwards (internal/store/storetest).
        run: go test -count=1 ./...
        env:
          CHURR_TEST_POSTGRES: postgres://churr:churr@localhost:5432/churr_test?sslmode=disable
      - name: Race detector
        run: go test -count=1 -race -timeout 40m ./internal/live/... ./internal/chat/... ./internal/api/... ./internal/server/...

  # Every file that is made from another must be what its source makes now.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Migrations are what docs/schema.sql generates
        run: |
          go test -count=1 ./internal/store/migrations -update
          git diff --exit-code -- internal/store/migrations
      - name: The contract and the operations table are what tools/openapi-gen writes
        run: |
          pip install --quiet pyyaml openapi-spec-validator
          python3 tools/openapi-gen/build.py
          git diff --exit-code -- docs/openapi.yaml docs/API.md internal/api/operations_gen.go
      - name: The list of operations not built yet is up to date
        run: |
          go test -count=1 -run 'TestTableMatchesContract|TestEveryOperationRoutes|TestUnimplemented' ./internal/api/
          git diff --exit-code -- internal/api/UNIMPLEMENTED.txt
      - name: The Markdown corpus is what the parser gives
        run: |
          go test -count=1 ./internal/markdown -run TestCorpus -update
          git diff --exit-code -- testdata/markdown
      - name: The sealed-chat vectors, if present, are what the reference makes
        run: |
          if ls testdata/sealed/*.json >/dev/null 2>&1; then
            go test -count=1 ./internal/sealed/...
            git diff --exit-code -- testdata/sealed
          else
            echo "no sealed vectors yet"
          fi

  image:
    needs: [test, generated]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: churr
            target: ""
          - name: churr-hub
            target: hub
          - name: churr-relay
            target: relay
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tikaydaes/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
