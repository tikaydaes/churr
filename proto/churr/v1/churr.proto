  Message message = 3;
  optional string author_name = 4;
}

// One post in a conversation, in the shape MESSAGE-FORMAT.md defines. In a sealed chat only `id`, `conversation_id`, `seq`, `order`, `author_id`, `client_id`, `sealed`, `quiet` and `created_at` are present, `late` and `unsent` where they apply, and `deleted_at` once deleted.
message Message {
  repeated int32 empty_fields = 1;
  repeated int32 null_fields = 2;
  optional bytes id = 3; // identifier
  optional bytes conversation_id = 4; // identifier
  optional int64 seq = 5;
  optional bytes author_id = 6; // identifier
  optional bytes client_id = 7; // identifier
  optional bytes parent_id = 8; // identifier
  Quote quote = 9;
  optional string text = 10;
  repeated Entity entities = 11;
  repeated Task tasks = 12;
  repeated File files = 13;
