message GetServerResponse {
  repeated int32 null_fields = 2;
  Server server = 3;
}

// What a server says about itself before and after sign-in.
message Server {
  repeated int32 empty_fields = 1;
  repeated int32 null_fields = 2;
  optional string name = 3;
  optional string community_name = 4;
  optional string icon_url = 5;
  optional string version = 6;
  optional string min_app_version = 7;
  optional bool setup_needed = 8;
  ServerSignIn sign_in = 9;
  ServerFeatures features = 10;
  repeated ServerPushKinds push_kinds = 11;
  ServerLimits limits = 12;
  optional string welcome = 13;
  DefaultThemes default_themes = 14;
}

message ServerSignIn {
  repeated int32 empty_fields = 1;
  repeated int32 null_fields = 2;
  optional ServerSignInRegistration registration = 3;
  optional ServerSignInMemberSignIn member_sign_in = 4;
  optional ServerSignInSecondFactor second_factor = 5;
  repeated SsoProviderSummary providers = 6;
}

// A company sign-in provider as shown on the sign-in page.
message SsoProviderSummary {
  repeated int32 null_fields = 2;
  optional bytes id = 3; // identifier
  optional SsoProviderSummaryKind kind = 4;
  optional string name = 5;
}

// Features an admin can switch.
message ServerFeatures {
  repeated int32 null_fields = 2;
  optional bool sealed_chats = 3;
  optional bool calls = 4;
  optional bool link_previews = 5;
  optional bool blocking = 6;
  optional bool members_may_invite = 7;
  optional bool members_may_add_emoji = 8;
  optional bool broadcast_mentions_managers_only = 9;
}

message ServerLimits {
  repeated int32 null_fields = 2;
  optional int64 message_text = 3;
  optional int64 file_size = 4;
  optional int64 quick_correction_seconds = 5;
  optional int64 edit_window_seconds = 6;
  optional int64 retention_seconds = 7;
  optional int64 call_participants = 8;
  optional int64 call_cameras = 9;
}

// The server's default themes. Absent: none set.
message DefaultThemes {
  repeated int32 null_fields = 2;
  CardTheme dark = 3;
  CardTheme light = 4;
}

// A copy of a theme as a theme card or a server default carries it.
message CardTheme {
  repeated int32 null_fields = 2;
  optional bytes id = 3; // identifier
  optional string name = 4;
  optional CardThemeKind kind = 5;
  ThemeColours colours = 6;
  optional bytes author_id = 7; // identifier
}

// The base colours of a theme (docs/STYLE.md, "Themes"): exactly these nine, each six hex digits. Every other colour is derived from them by the rules there.
message ThemeColours {
  repeated int32 null_fields = 2;
  optional string bg = 3;
  optional string panel = 4;
  optional string raise = 5;
  optional string ink = 6;
  optional string dim = 7;
  optional string lav = 8;
  optional string cyan = 9;
  optional string pink = 10;
  optional string yel = 11;
}

// The error shape every failed request returns (CONVENTIONS.md, Errors).
message Error {
  repeated int32 null_fields = 2;
  ErrorError error = 3;
}

message ErrorError {
  repeated int32 null_fields = 2;
  optional ErrorErrorCode code = 3;
  optional string message = 4;
  optional string field = 5;
  optional int64 retry_after_seconds = 6;
}

// The document at `/.well-known/churr`, exactly as `docs/LINK-PROTOCOL.md` defines it. A hub serves the same document with `kind` `hub` and no box key.
message WellKnown {
  repeated int32 null_fields = 2;
  optional int64 churr = 3;
  optional WellKnownKind kind = 4;
  optional string name = 5;
  optional bytes sign_key = 6;
  optional bytes box_key = 7;
  optional bytes box_key_sig = 8;
  WellKnownLink link = 9;
}

// Where and how to link.
message WellKnownLink {
  repeated int32 empty_fields = 1;
  repeated int32 null_fields = 2;
  repeated int64 versions = 3;
  optional string url = 4;
}

message BeginSetupRequest {
  repeated int32 null_fields = 2;
  optional string setup_token = 3;
  optional string username = 4;
  optional string display_name = 5;
}

// The start of a passkey step. `public_key` is passed to the browser's passkey API as it is.
message Ceremony {
  repeated int32 null_fields = 2;
  optional string ceremony_id = 3;
  Value public_key = 4;
}

// The end of a passkey creation.
message PasskeyCreated {
  repeated int32 null_fields = 2;
  optional string ceremony_id = 3;
  Value credential = 4;
  optional string passkey_name = 5;
  optional bool prf_enabled = 6;
}

// The result of a sign-in step. The response also sets the `churr_session` cookie, with a new token each time the session changes state.
message SignIn {
  repeated int32 empty_fields = 1;
  repeated int32 null_fields = 2;
  Session session = 3;
  Me account = 4;
  SecondFactorState second_factor = 5;
  repeated string recovery_codes = 6;
}

// One signed-in client, token or bot credential.
message Session {
  repeated int32 null_fields = 2;
  optional bytes id = 3; // identifier
  optional SessionKind kind = 4;
  optional string label = 5;
  optional SessionSignedInBy signed_in_by = 6;
  optional SessionSecondFactor second_factor = 7;
  optional bool pending_second_factor = 8;
  optional bool recovery = 9;
  optional bool current = 10;
  optional int64 created_at = 11; // time
  optional int64 last_seen_at = 12; // time
  optional int64 expires_at = 13; // time
}

// The caller's own account: the public shape plus what only they see.
message Me {
  repeated int32 empty_fields = 1;
  repeated int32 null_fields = 2;
  optional bytes id = 3; // identifier
  optional string username = 4;
  optional string server_name = 5;
  optional MeRole role = 6;
  optional string display_name = 7;
  optional bytes avatar_file_id = 8; // identifier
  optional string avatar_url = 9;
  optional string title = 10;
  optional string pronouns = 11;
  optional string time_zone = 12;
  optional MePresence presence = 13;
  optional bool in_call = 14;
  optional MeLastSeen last_seen = 30;
  Status status = 15;
  Availability availability = 16;
  optional bool dnd = 17;
  repeated bytes group_ids = 18; // identifier
  optional bool claimed = 19;
  optional int64 created_at = 20; // time
  optional int64 removed_at = 21; // time
  Prefs prefs = 22;
  Dnd dnd_state = 23;
  MeAppearAway appear_away = 24;
  QuietHours quiet_hours = 25;
  optional int64 passkey_count = 26;
  optional bool has_totp = 27;
  optional int64 identity_count = 28;
  repeated bytes blocked_ids = 29; // identifier
}

// The status a person or bot sets.
message Status {
  repeated int32 null_fields = 2;
  optional string emoji = 3;
  optional string text = 4;
  optional int64 until = 5; // time
  optional bool pause_notifications = 6;
  optional bool appear_away = 7;
}

// In a meeting, or out of office.
message Availability {
  repeated int32 null_fields = 2;
  optional AvailabilityValue value = 3;
  optional int64 until = 4; // time
  optional AvailabilitySetBy set_by = 5;
}

// Personal preferences saved on the server.
message Prefs {
  repeated int32 null_fields = 2;
  optional PrefsThreadView thread_view = 3;
  optional bool meeting_pauses = 4;
  optional bool hide_last_seen = 6;
  optional bool allow_notify_anyway = 5;
}

// The caller's do not disturb in detail. Other people see only the mark.
message Dnd {
  repeated int32 empty_fields = 1;
  repeated int32 null_fields = 2;
  optional bool on = 3;
  repeated DndSources sources = 4;
  optional int64 manual_until = 5; // time
  optional int64 until = 6; // time
}

// The manual appear-away switch.
message MeAppearAway {
  repeated int32 null_fields = 2;
  optional bool on = 3;
  optional int64 until = 4; // time
}

// The daily schedule that puts the account in do not disturb.
message QuietHours {
  repeated int32 null_fields = 2;
  optional string start = 3;
  optional string end = 4;
  optional string days = 5;
  optional string time_zone = 6;
  optional int64 skip_until = 7; // time
}

// The proofs a pending session may give.
message SecondFactorState {
  repeated int32 empty_fields = 1;
  repeated int32 null_fields = 2;
  repeated SecondFactorStateAccepted accepted = 3;
  repeated SecondFactorStateSetUp set_up = 4;
}

message CheckInviteResponse {
  repeated int32 null_fields = 2;
  optional CheckInviteResponseRole role = 3;
  optional string claims_username = 4;
}

message BeginPasskeyRegistrationRequest {
  repeated int32 null_fields = 2;
  optional string invite_code = 3;
  optional string username = 4;
  optional string display_name = 5;
}

// The end of a passkey step.
message CeremonyResult {
  repeated int32 null_fields = 2;
  optional string ceremony_id = 3;
  Value credential = 4;
}

message GetSecondFactorResponse {
  repeated int32 null_fields = 2;
  SecondFactorState second_factor = 3;
}

message RecoverWithCodeRequest {
  repeated int32 null_fields = 2;
  optional string username = 3;
