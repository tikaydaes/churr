message WakeUp {
  repeated int32 empty_fields = 1;
  repeated int32 null_fields = 2;
  optional WakeUpKind kind = 3;
  WakeUpConversation conversation = 4;
  repeated WakeUpMessage messages = 5;
  optional int64 more = 6;
