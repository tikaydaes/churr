// What a time reference has measured of one server's clock and of the path between the two, in the link's own ping and pong. The reference is a hub, or the owner server on a direct link. A constant difference between the two directions of a path cannot be told from a clock offset; its effect on `offset_ms` is at most half of `latency_ms`, which is why `uncertainty_ms` is never less than that unless `synced`.
message PeerClock {
  repeated int32 null_fields = 2;
  optional int64 offset_ms = 3;
  optional int64 latency_ms = 4;
  optional int64 jitter_ms = 5;
  optional int64 uncertainty_ms = 6;
  optional int64 forward_ms = 7;
  optional int64 forward_jitter_ms = 8;
  optional int64 back_ms = 9;
  optional int64 back_jitter_ms = 10;
  optional int64 asymmetry_ms = 11;
  optional bool synced = 12;
  optional int64 samples = 13;
  optional int64 measured_at = 14; // time
}

