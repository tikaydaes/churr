<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 398" width="860" height="398" role="img" aria-labelledby="t d">
<title id="t">Bytes sent per frame</title>
<desc id="d">Bars of frame sizes in bytes for the web chat, which speaks compressed JSON, and the apps, which speak compressed protobuf. Message, 200-byte text: 334 and 274. Reaction: 213 and 88. Read position: 188 and 56. Typing: 176 and 55. Presence change: 115 and 41.</desc>
<style>
:root{--bg:#f5f2ff;--ink:#15173a;--dim:#55527f;--faint:#6b6894;--grid:#dcd5f7;--line:#c9c1ee;
--cyan:#006e66;--lav:#5b3fd6;--org:#a8480a;--cyan2:#5aa8a1;--lav2:#9d8fe6}
@media (prefers-color-scheme: dark){:root{--bg:#0d1026;--ink:#efeaff;--dim:#a09dc9;--faint:#8b88b8;--grid:#1d2250;--line:#2c3170;
--cyan:#5df0e4;--lav:#b9a0ff;--org:#ff9a4d;--cyan2:#2c8580;--lav2:#6a5aa8}}
text{font-family:Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.t{font-size:19px;font-weight:800}
.s{font-size:12.5px;fill:var(--dim)}
.h{font-size:11px;font-weight:700;letter-spacing:.09em;fill:var(--faint)}
.g{font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:5px}
.gm{font-weight:400;fill:var(--dim)}
.r{font-size:12.5px;fill:var(--dim)}
.v{font-family:'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px}
.vd{font-family:'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:var(--dim)}
.k{font-family:'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10px;fill:var(--faint)}
.n{font-size:11.5px;fill:var(--faint)}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--line);stroke-width:1}
.rng{stroke:var(--line);stroke-width:2}
.cyan{fill:var(--cyan)}.lav{fill:var(--lav)}.org{fill:var(--org)}
.cyan2{fill:var(--cyan2)}.lav2{fill:var(--lav2)}
.hollow{fill:var(--bg);stroke:var(--org);stroke-width:2}
.peak{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.ring{stroke:var(--bg);stroke-width:2}
</style>
<polygon class="bg" points="0,0 842,0 860,18 860,398 0,398"/>
<text class="t" x="28" y="42">Bytes sent per frame</text>
<text class="s" x="28" y="63">The size of one frame sent to one connection, for five common kinds, as each client speaks.</text>
<rect class="lav" x="28" y="87" width="10" height="10"/>
<text class="r" x="44" y="96">web chat (compressed JSON)</text>
<rect class="cyan" x="237.6" y="87" width="10" height="10"/>
<text class="r" x="253.6" y="96">apps (compressed protobuf)</text>
<line class="axis" x1="220" y1="126" x2="220" y2="336"/>
<text class="k" x="220" y="350" text-anchor="middle">0</text>
<line class="grid" x1="364.4" y1="126" x2="364.4" y2="336"/>
<text class="k" x="364.4" y="350" text-anchor="middle">100</text>
<line class="grid" x1="508.9" y1="126" x2="508.9" y2="336"/>
<text class="k" x="508.9" y="350" text-anchor="middle">200</text>
<line class="grid" x1="653.3" y1="126" x2="653.3" y2="336"/>
<text class="k" x="653.3" y="350" text-anchor="middle">300 bytes</text>
<text class="g" x="28" y="151">Message, 200-byte text</text>
<rect class="lav" x="220" y="134" width="482.4" height="11"/>
<text class="v" x="708.4" y="143.5">334</text>
<rect class="cyan" x="220" y="147" width="395.8" height="11"/>
<text class="v" x="621.8" y="156.5">274</text>
<text class="g" x="28" y="193">Reaction</text>
<rect class="lav" x="220" y="176" width="307.7" height="11"/>
<text class="v" x="533.7" y="185.5">213</text>
<rect class="cyan" x="220" y="189" width="127.1" height="11"/>
<text class="v" x="353.1" y="198.5">88</text>
<text class="g" x="28" y="235">Read position</text>
<rect class="lav" x="220" y="218" width="271.6" height="11"/>
<text class="v" x="497.6" y="227.5">188</text>
<rect class="cyan" x="220" y="231" width="80.9" height="11"/>
<text class="v" x="306.9" y="240.5">56</text>
<text class="g" x="28" y="277">Typing</text>
<rect class="lav" x="220" y="260" width="254.2" height="11"/>
<text class="v" x="480.2" y="269.5">176</text>
<rect class="cyan" x="220" y="273" width="79.4" height="11"/>
<text class="v" x="305.4" y="282.5">55</text>
<text class="g" x="28" y="319">Presence change</text>
<rect class="lav" x="220" y="302" width="166.1" height="11"/>
<text class="v" x="392.1" y="311.5">115</text>
<rect class="cyan" x="220" y="315" width="59.2" height="11"/>
<text class="v" x="285.2" y="324.5">41</text>
<text class="n" x="28" y="380">Averaged over a 50,000-member run: 244 bytes per delivered frame as compressed JSON, 185 as compressed protobuf.</text>
</svg>
