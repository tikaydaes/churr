<text class="r" x="38" y="353">everyone online · 50 posts/s</text>
<rect class="lav" x="330" y="343" width="40" height="12"/>
<text class="v" x="376" y="353">1.2</text>
<polygon class="peak" points="466.7,344 471.7,349 466.7,354 461.7,349"/>
<text class="vd" x="476.7" y="353">4.1</text>
<rect class="lav" x="590" y="343" width="63.3" height="12"/>
<text class="v" x="659.3" y="353">1.9 GB</text>
<text class="g" x="28" y="386">50,000 members<tspan class="gm">   16 dedicated vCPU, 64 GB, PostgreSQL 18</tspan></text>
<text class="r" x="38" y="411">10,000 online · 20 posts/s</text>
<rect class="cyan" x="330" y="401" width="13.3" height="12"/>
<text class="v" x="349.3" y="411">~0.4</text>
<rect class="cyan" x="590" y="401" width="36.7" height="12"/>
<text class="v" x="632.7" y="411">~1.1 GB</text>
<text class="r" x="38" y="435">everyone online, 5% viewing #general · 50 posts/s</text>
<rect class="lav" x="330" y="425" width="100" height="12"/>
<text class="v" x="436" y="435">~3</text>
<rect class="lav" x="590" y="425" width="130" height="12"/>
<text class="v" x="726" y="435">3.9 GB</text>
<text class="r" x="38" y="459">everyone online, all viewing #general · 50 posts/s</text>
<rect class="lav" x="330" y="449" width="53.3" height="12"/>
<text class="v" x="389.3" y="459">~1.6</text>
<rect class="lav" x="590" y="449" width="143.3" height="12"/>
<text class="v" x="739.3" y="459">~4.3 GB</text>
<text class="n" x="28" y="518">Synthetic text chat, one run each, 15 November 2026. ~ marks a figure recorded as approximate.</text>
</svg>
