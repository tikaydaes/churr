<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 536" width="860" height="536" role="img" aria-labelledby="t d">
<title id="t">What each run used</title>
<desc id="d">Horizontal bars for eight load-test runs on four machine sizes, 500 to 50,000 members: the processors Churr used and the peak memory. 500 members on 1 vCPU, 1 GB, SQLite, everyone online · 5 posts/s: 0.04 CPUs, 95 MB. 5,000 members on 4 vCPU, 8 GB, PostgreSQL 18, 1,000 online · 20 posts/s: 0.24 CPUs, 155 MB. 5,000 members on 4 vCPU, 8 GB, PostgreSQL 18, everyone online · 20 posts/s: 0.62 CPUs, 576 MB. 20,000 members on 8 vCPU, 16 GB, PostgreSQL 18, 4,000 online · 20 posts/s: 0.19 CPUs, 453 MB. 20,000 members on 8 vCPU, 16 GB, PostgreSQL 18, everyone online · 50 posts/s: 1.2 CPUs (busiest 4.1), 1.9 GB. 50,000 members on 16 dedicated vCPU, 64 GB, PostgreSQL 18, 10,000 online · 20 posts/s: about 0.4 CPUs, about 1.1 GB. 50,000 members on 16 dedicated vCPU, 64 GB, PostgreSQL 18, everyone online, 5% viewing #general · 50 posts/s: about 3 CPUs, 3.9 GB. 50,000 members on 16 dedicated vCPU, 64 GB, PostgreSQL 18, everyone online, all viewing #general · 50 posts/s: about 1.6 CPUs, about 4.3 GB.</desc>
<style>
:root{--bg:#f5f2ff;--ink:#15173a;--dim:#55527f;--faint:#6b6894;--grid:#dcd5f7;--line:#c9c1ee;
--cyan:#006e66;--lav:#5b3fd6;--org:#a8480a;--cyan2:#5aa8a1;--lav2:#9d8fe6}
@media (prefers-color-scheme: dark){:root{--bg:#0d1026;--ink:#efeaff;--dim:#a09dc9;--faint:#8b88b8;--grid:#1d2250;--line:#2c3170;
--cyan:#5df0e4;--lav:#b9a0ff;--org:#ff9a4d;--cyan2:#2c8580;--lav2:#6a5aa8}}
text{font-family:Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.t{font-size:19px;font-weight:800}
.s{font-size:12.5px;fill:var(--dim)}
.h{font-size:11px;font-weight:700;letter-spacing:.09em;fill:var(--faint)}
.g{font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:5px}
.gm{font-weight:400;fill:var(--dim)}
.r{font-size:12.5px;fill:var(--dim)}
.v{font-family:'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px}
.vd{font-family:'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:var(--dim)}
.k{font-family:'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10px;fill:var(--faint)}
.n{font-size:11.5px;fill:var(--faint)}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--line);stroke-width:1}
.rng{stroke:var(--line);stroke-width:2}
.cyan{fill:var(--cyan)}.lav{fill:var(--lav)}.org{fill:var(--org)}
.cyan2{fill:var(--cyan2)}.lav2{fill:var(--lav2)}
.hollow{fill:var(--bg);stroke:var(--org);stroke-width:2}
.peak{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.ring{stroke:var(--bg);stroke-width:2}
</style>
<polygon class="bg" points="0,0 842,0 860,18 860,536 0,536"/>
<text class="t" x="28" y="42">What each run used</text>
<text class="s" x="28" y="63">Each heading is a community size and the machine it ran on. Bars are what Churr itself used while</text>
<text class="s" x="28" y="80">messages flowed. PostgreSQL used 0.2 of a CPU or less in every run that had it.</text>
<rect class="cyan" x="28" y="95" width="10" height="10"/>
<text class="r" x="44" y="104">a fifth of members online, 20 posts/s</text>
<rect class="lav" x="310.2" y="95" width="10" height="10"/>
<text class="r" x="326.2" y="104">everyone online</text>
<polygon class="peak" points="452.2,95 457.2,100 452.2,105 447.2,100"/>
<text class="r" x="463.2" y="104">busiest</text>
<text class="h" x="330" y="132">CPUS USED BY CHURR</text>
<text class="h" x="590" y="132">PEAK MEMORY</text>
<line class="axis" x1="330" y1="140" x2="330" y2="474"/>
<text class="k" x="330" y="488" text-anchor="middle">0</text>
<line class="grid" x1="363.3" y1="140" x2="363.3" y2="474"/>
<text class="k" x="363.3" y="488" text-anchor="middle">1</text>
<line class="grid" x1="396.7" y1="140" x2="396.7" y2="474"/>
<text class="k" x="396.7" y="488" text-anchor="middle">2</text>
<line class="grid" x1="430" y1="140" x2="430" y2="474"/>
<text class="k" x="430" y="488" text-anchor="middle">3</text>
<line class="grid" x1="463.3" y1="140" x2="463.3" y2="474"/>
<text class="k" x="463.3" y="488" text-anchor="middle">4 CPUs</text>
<line class="axis" x1="590" y1="140" x2="590" y2="474"/>
<text class="k" x="590" y="488" text-anchor="middle">0</text>
<line class="grid" x1="623.3" y1="140" x2="623.3" y2="474"/>
<text class="k" x="623.3" y="488" text-anchor="middle">1</text>
<line class="grid" x1="656.7" y1="140" x2="656.7" y2="474"/>
<text class="k" x="656.7" y="488" text-anchor="middle">2</text>
<line class="grid" x1="690" y1="140" x2="690" y2="474"/>
<text class="k" x="690" y="488" text-anchor="middle">3</text>
<line class="grid" x1="723.3" y1="140" x2="723.3" y2="474"/>
<text class="k" x="723.3" y="488" text-anchor="middle">4 GB</text>
<text class="g" x="28" y="164">500 members<tspan class="gm">   1 vCPU, 1 GB, SQLite</tspan></text>
<text class="r" x="38" y="189">everyone online · 5 posts/s</text>
<rect class="lav" x="330" y="179" width="1.3" height="12"/>
<text class="v" x="337.3" y="189">0.04</text>
<rect class="lav" x="590" y="179" width="3.2" height="12"/>
<text class="v" x="599.2" y="189">95 MB</text>
<text class="g" x="28" y="222">5,000 members<tspan class="gm">   4 vCPU, 8 GB, PostgreSQL 18</tspan></text>
<text class="r" x="38" y="247">1,000 online · 20 posts/s</text>
<rect class="cyan" x="330" y="237" width="8" height="12"/>
<text class="v" x="344" y="247">0.24</text>
<rect class="cyan" x="590" y="237" width="5.2" height="12"/>
<text class="v" x="601.2" y="247">155 MB</text>
<text class="r" x="38" y="271">everyone online · 20 posts/s</text>
<rect class="lav" x="330" y="261" width="20.7" height="12"/>
<text class="v" x="356.7" y="271">0.62</text>
<rect class="lav" x="590" y="261" width="19.2" height="12"/>
<text class="v" x="615.2" y="271">576 MB</text>
<text class="g" x="28" y="304">20,000 members<tspan class="gm">   8 vCPU, 16 GB, PostgreSQL 18</tspan></text>
<text class="r" x="38" y="329">4,000 online · 20 posts/s</text>
<rect class="cyan" x="330" y="319" width="6.3" height="12"/>
<text class="v" x="342.3" y="329">0.19</text>
<rect class="cyan" x="590" y="319" width="15.1" height="12"/>
