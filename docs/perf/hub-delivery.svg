<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="860" height="290" role="img" aria-labelledby="t d">
<title id="t">Three servers sharing a channel through one hub</title>
<desc id="d">Delivery time at the 50th, 95th and 99th percentile for three runs through a hub, on a scale from 0 to 50 milliseconds. 5 posts a second: 27, 38 and 43 milliseconds. 10 posts a second: 25, 37 and 45 milliseconds. 20 posts a second: 25, 36 and 42 milliseconds.</desc>
<style>
:root{--bg:#f5f2ff;--ink:#15173a;--dim:#55527f;--faint:#6b6894;--grid:#dcd5f7;--line:#c9c1ee;
--cyan:#006e66;--lav:#5b3fd6;--org:#a8480a;--cyan2:#5aa8a1;--lav2:#9d8fe6}
@media (prefers-color-scheme: dark){:root{--bg:#0d1026;--ink:#efeaff;--dim:#a09dc9;--faint:#8b88b8;--grid:#1d2250;--line:#2c3170;
--cyan:#5df0e4;--lav:#b9a0ff;--org:#ff9a4d;--cyan2:#2c8580;--lav2:#6a5aa8}}
text{font-family:Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.t{font-size:19px;font-weight:800}
.s{font-size:12.5px;fill:var(--dim)}
.h{font-size:11px;font-weight:700;letter-spacing:.09em;fill:var(--faint)}
.g{font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:5px}
.gm{font-weight:400;fill:var(--dim)}
.r{font-size:12.5px;fill:var(--dim)}
.v{font-family:'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px}
.vd{font-family:'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:var(--dim)}
.k{font-family:'Martian Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10px;fill:var(--faint)}
.n{font-size:11.5px;fill:var(--faint)}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--line);stroke-width:1}
.rng{stroke:var(--line);stroke-width:2}
.cyan{fill:var(--cyan)}.lav{fill:var(--lav)}.org{fill:var(--org)}
.cyan2{fill:var(--cyan2)}.lav2{fill:var(--lav2)}
.hollow{fill:var(--bg);stroke:var(--org);stroke-width:2}
.peak{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.ring{stroke:var(--bg);stroke-width:2}
</style>
<polygon class="bg" points="0,0 842,0 860,18 860,290 0,290"/>
<text class="t" x="28" y="42">Three servers sharing a channel through one hub</text>
<text class="s" x="28" y="63">300 members on each of three 1-vCPU servers, all in one shared channel. Delivery time to every member</text>
<text class="s" x="28" y="80">on every server. Every run delivered every message.</text>
<rect class="cyan ring" x="27.5" y="94.5" width="11" height="11"/>
<text class="r" x="44" y="104">half arrived within (p50)</text>
<polygon class="lav ring" points="236,92.5 243.5,100 236,107.5 228.5,100"/>
<text class="r" x="247" y="104">95 in 100 (p95)</text>
<rect class="hollow" x="369" y="96" width="8" height="8"/>
<text class="r" x="384" y="104">99 in 100 (p99)</text>
<text class="h" x="340" y="132">DELIVERY TIME</text>
<text class="h" x="676" y="132">P50 / P95 / P99</text>
<line class="grid" x1="340" y1="144" x2="340" y2="228"/>
<text class="k" x="340" y="242" text-anchor="middle">0 ms</text>
<line class="grid" x1="402" y1="144" x2="402" y2="228"/>
<text class="k" x="402" y="242" text-anchor="middle">10 ms</text>
<line class="grid" x1="464" y1="144" x2="464" y2="228"/>
<text class="k" x="464" y="242" text-anchor="middle">20 ms</text>
<line class="grid" x1="526" y1="144" x2="526" y2="228"/>
<text class="k" x="526" y="242" text-anchor="middle">30 ms</text>
<line class="grid" x1="588" y1="144" x2="588" y2="228"/>
<text class="k" x="588" y="242" text-anchor="middle">40 ms</text>
<line class="grid" x1="650" y1="144" x2="650" y2="228"/>
<text class="k" x="650" y="242" text-anchor="middle">50 ms</text>
<text class="r" x="28" y="159">5 posts/s</text>
<line class="rng" x1="507.4" y1="155" x2="606.6" y2="155"/>
<rect class="cyan ring" x="501.9" y="149.5" width="11" height="11"/>
<rect class="hollow" x="602.6" y="151" width="8" height="8"/>
<polygon class="lav ring" points="575.6,147.5 583.1,155 575.6,162.5 568.1,155"/>
<text class="v" x="676" y="159">27 / 38 / 43 ms</text>
<text class="r" x="28" y="185">10 posts/s</text>
<line class="rng" x1="495" y1="181" x2="619" y2="181"/>
<rect class="cyan ring" x="489.5" y="175.5" width="11" height="11"/>
<rect class="hollow" x="615" y="177" width="8" height="8"/>
<polygon class="lav ring" points="569.4,173.5 576.9,181 569.4,188.5 561.9,181"/>
<text class="v" x="676" y="185">25 / 37 / 45 ms</text>
<text class="r" x="28" y="211">20 posts/s</text>
<line class="rng" x1="495" y1="207" x2="600.4" y2="207"/>
<rect class="cyan ring" x="489.5" y="201.5" width="11" height="11"/>
<rect class="hollow" x="596.4" y="203" width="8" height="8"/>
<polygon class="lav ring" points="563.2,199.5 570.7,207 563.2,214.5 555.7,207"/>
<text class="v" x="676" y="211">25 / 36 / 42 ms</text>
<text class="n" x="28" y="272">Compressed protobuf on the links and the clients. One run at each rate. Median on the same server 12.5–14 ms, on another 28–30 ms.</text>
</svg>
