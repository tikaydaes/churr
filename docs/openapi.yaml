    get:
      operationId: search
      tags: [Search]
      summary: Search messages
      description: |-
        **Who:** Any signed-in account.

        Covers channels the caller can read, replies included. Never sealed chats, and never message history. Paged by cursor. `q` may be empty when a filter (`in`, `from`, `since`, `until` or `has_file`) is given; with neither, the answer is `invalid_value`. Each result carries the message and a snippet, not its conversation.
      parameters:
      - name: q
        in: query
        description: The words to find. May be empty when a filter is given.
        schema:
          type: string
      - name: in
        in: query
        description: Only this conversation.
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        description: Only this author.
        schema:
          type: string
          format: uuid
      - name: since
        in: query
        description: Only messages posted at or after this time.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Only messages posted before this time.
        schema:
          type: string
          format: date-time
      - name: has_file
        in: query
        description: Only messages with a file.
        schema:
          type: boolean
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  next_cursor:
                    type: string
