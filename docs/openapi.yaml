# Churr HTTP API. OpenAPI 3.1.
# Written by tools/openapi-gen/build.py. Do not edit by hand: change the sources there and run it again.
# The rules are in docs/CONVENTIONS.md and the message object in docs/MESSAGE-FORMAT.md.
# If this file disagrees with either, they are right and the generator's sources need fixing.
openapi: 3.1.0
info:
  title: Churr API
  version: 1.0.0
  summary: The HTTP API of a Churr server.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
  description: |
    The apps, the web chat, bots and scripts all use this API. Nothing is reachable only through one client.

    This file is written by `tools/openapi-gen/build.py`. Change the sources there, not this file.

    Read `docs/API.md` for a guide, `docs/CONVENTIONS.md` for the rules this file follows, `docs/MESSAGE-FORMAT.md` for the message object, and `docs/EVENTS.md` for the live connection. `docs/AUTH.md`, `docs/SEALED.md`, `docs/BOTS.md`, `docs/CALLS.md`, `docs/PUSH.md` and `docs/LINK-PROTOCOL.md` say what the operations in their areas do in full.

    In brief:

    - Paths under `/api/v1` take and return JSON in UTF-8, except uploads (multipart) and downloads.
    - Field names are `snake_case`. Identifiers are UUIDv7. Times are RFC 3339 in UTC with milliseconds. Absent and `null` mean the same; servers omit `null` fields. Unknown request fields are refused with `invalid_request`.
    - Authenticate with the `churr_session` cookie or `Authorization: Bearer <token>`. A request that carries the cookie and is not a `GET` or `HEAD` must come from the server's own origin.
    - Every failure has the `Error` shape. Each operation lists the codes it can return in its responses and again in `x-error-codes`. Something that exists but that the caller may not know exists answers `not_found`.
    - Some operations need a fresh check: a passkey or authenticator-app check passed on this session in the last ten minutes. Without it they answer `fresh_check_required`; the client runs `beginPasskeyCheck` and `finishPasskeyCheck`, or `checkTotp`, and tries again.
    - Lists ordered by `seq` take `before`, `after` and `limit` and return `has_more`. Filters by time are `since` and `until`. Other lists take `limit` and `cursor` and return `next_cursor`.
    - Every response to an authenticated request carries `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`.
    - A few addresses are answered by the server but are not operations here: the form posts of its own pages, `POST /oauth/authorize` (approving an app) and `POST /sso/register` (the username at a first company sign-in); `GET /healthz`; `GET /link/v1`, where other servers and hubs connect (`docs/LINK-PROTOCOL.md`); the theme page at `/themes/{id}`; the web pages and the web chat; and, on port 80 when the server gets its own certificate, the certificate authority's challenge (every other request there is redirected to HTTPS).
    - Each operation's description starts with who may call it. "Admins" includes the owner. "Acting as manager" means a manager of the channel, or an admin in a public channel or a private one they belong to.
servers:
- url: https://{host}
  description: A Churr server.
  variables:
    host:
      default: chat.example.org
      description: The server's public host name.
security:
- session_cookie: []
- bearer_token: []
tags:
- name: Server
  description: What the server is, and first-run setup.
- name: Sign-in
  description: Passkeys, recovery, company sign-in, second factors and sign-out. Every endpoint here is limited
    per address.
- name: OAuth
  description: 'How the apps sign in: authorization code with PKCE in the system browser, or QR pairing from a signed-in
    web page. Outside `/api/v1`.'
- name: Me
  description: The caller's own account, preferences and credentials.
- name: Status
  description: Status, availability, do not disturb, quiet hours, appear away and presets. All belong to the account,
    not to a channel.
- name: Accounts
  description: Other accounts, groups and blocks.
- name: Conversations
  description: 'Channels, ad-hoc channels and sealed chats: finding, creating, changing, joining and leaving them.'
- name: Messages
  description: Reading, posting, editing and deleting messages, and the things that sit beside a message.
- name: Forms
  description: Answering forms and polls, and reading their results.
- name: Threads
  description: Following, ignoring and reading threads, and the Threads view.
- name: Files
  description: Uploads, downloads and custom emoji.
- name: Search
  description: Full-text search across what the caller may read.
- name: Events
  description: The live connection and catch-up. docs/EVENTS.md describes the frames and every event.
- name: Scheduled
  description: Messages to send later, reminders and recurring forms.
- name: Commands
  description: 'What can be typed as `/name`: built-in commands, saved replies and bot commands.'
- name: Bots
  description: 'What bots do beyond the ordinary API: register commands, answer interactions and open dialogs. Also
    webhook requests.'
- name: Webhook intake
  description: Where outside tools post. Outside `/api/v1`. The secret in the path is the only credential. Bodies
    are at most 1 MB.
- name: Calls
  description: Joining and leaving a call. Signalling runs over the live connection (docs/EVENTS.md).
- name: Server integrations
  description: For programs that work on the server as a whole. Authenticated by an integration token (`churr_int_`),
    which works nowhere else.
- name: Sealed chats
  description: What the server stores and hands on for sealed chats and their key backup. It can read none of it.
    SEALED.md is the authority; the names here are its names.
- name: 'Admin: settings and sign-in'
  description: Server settings, which include the sign-in policy, and company sign-in providers.
- name: 'Admin: people'
  description: Invites, accounts and roles, bans, time-outs and groups.
- name: 'Admin: channels and content'
  description: Sections, the channel list, emoji, saved replies, status presets, word filters, reports and purge
    requests.
- name: 'Admin: bots and integrations'
  description: Bots and their tokens, the webhook queue, and server integrations.
- name: 'Admin: linked servers'
  description: Peers and streams for sharing channels with other servers (LINK-PROTOCOL.md). Owner only. Every one
    of these is written to the audit log.
- name: Channels on a hub
  description: A channel shared through a hub is owned by the hub (LINK-PROTOCOL.md section 23a). Its moderators
    are accounts, named in the record the hub signs; their authority reaches every server in the channel and does
    not depend on their role or level on their own server.
- name: 'Admin: records'
  description: The audit log, the export and server status.
- name: Themes
  description: 'Colour themes: each account''s own, the server''s library of published ones, and the server''s default
    dark and light themes. A theme stores its base colours only; clients derive the rest by the rules of docs/STYLE.md,
    and the server checks the contrast of the result with the same arithmetic.'
paths:
  /api/v1/server:
    get:
      operationId: getServer
      tags: [Server]
      summary: Get the server's name, sign-in methods and switched-on features
      description: |-
        **Who:** Anyone, signed in or not.

        The apps read it before sign-in. Until the owner exists, every other operation answers `unavailable`.
      security:
      - {}
      - session_cookie: []
      - bearer_token: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [server]
                properties:
                  server:
                    $ref: '#/components/schemas/Server'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.GetServerResponse
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes: [rate_limited, internal]
  /.well-known/churr:
    get:
      operationId: getWellKnown
      tags: [Server]
      summary: Get the server's name and public keys
      description: '**Who:** Anyone. Other servers and hubs use it to check keys.'
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellKnown'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.WellKnown
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes: [rate_limited, internal]
  /api/v1/setup/begin:
    post:
      operationId: beginSetup
      tags: [Server]
      summary: Start making the owner account
      description: |-
        **Who:** Whoever holds the one-time setup link printed when the server first starts.

        Works until an owner exists. Each start of the server without an owner makes a new setup link, so an old one answers `not_found`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setup_token, username, display_name]
              properties:
                setup_token:
                  type: string
                username:
                  type: string
                display_name:
                  type: string
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.BeginSetupRequest
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ceremony'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.Ceremony
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'Codes: `not_found`.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'Codes: `name_taken`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes:
      - invalid_request
      - invalid_value
      - not_found
      - name_taken
      - rate_limited
      - internal
  /api/v1/setup/finish:
    post:
      operationId: finishSetup
      tags: [Server]
      summary: Finish making the owner account
      description: |-
        **Who:** Whoever began setup.

        Creates the owner with its first passkey and eight recovery codes, and signs them in. The outside-connection switches are then set with `updateSettings`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyCreated'
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.PasskeyCreated
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignIn'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.SignIn
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 'Codes: `unauthenticated`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'Codes: `not_found`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes:
      - invalid_request
      - invalid_value
      - unauthenticated
      - not_found
      - rate_limited
      - internal
  /api/v1/setup/access-key:
    post:
      operationId: setupWithAccessKey
      tags: [Server]
      summary: Make the owner account with an access key in place of a passkey
      description: |-
        **Who:** Whoever holds the one-time setup link printed when the server first starts.

        For an owner who cannot use a passkey. The page makes the access key, shows it once and has it confirmed before it calls this; the server is sent only the value derived from it. Creates the owner with that access key and no recovery codes, signs them in, and finishes setup as `finishSetup` does.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setup_token, username, display_name, access_key_auth]
              properties:
                setup_token:
                  type: string
                username:
                  type: string
                display_name:
                  type: string
                access_key_auth:
                  type: string
                  contentEncoding: base64url
                  description: The 32-byte value the page derives from the access key (AUTH.md section 5.6), never
                    the key itself.
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.SetupWithAccessKeyRequest
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignIn'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.SignIn
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'Codes: `not_found`.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'Codes: `name_taken`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes:
      - invalid_request
      - invalid_value
      - not_found
      - name_taken
      - rate_limited
      - internal
  /api/v1/invite-codes/{code}:
    get:
      operationId: checkInvite
      tags: [Sign-in]
      summary: Check an invite or claim link before registering
      description: |-
        **Who:** Anyone holding the code.

        Checking uses nothing up. The invite is counted only when registration finishes.
      parameters:
      - $ref: '#/components/parameters/PathCode'
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role:
                    type: string
                    enum: [member, guest]
                  claims_username:
                    type: string
                    description: Set on a claim link for an imported account.
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.CheckInviteResponse
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'Codes: `not_found`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes: [invalid_request, not_found, rate_limited, internal]
  /api/v1/passkey/register/begin:
    post:
      operationId: beginPasskeyRegistration
      tags: [Sign-in]
      summary: Start registering a new account with a passkey
      description: |-
        **Who:** Anyone, if registration is `open`; otherwise only with a usable invite code. Refused with `forbidden` when the invite's role must use company sign-in. A claim link works in every registration mode.

        With a claim link the account already exists and `username` is ignored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invite_code:
                  type: string
                username:
                  type: string
                display_name:
                  type: string
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.BeginPasskeyRegistrationRequest
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ceremony'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.Ceremony
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Codes: `forbidden`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'Codes: `not_found`.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'Codes: `name_taken`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes:
      - invalid_request
      - invalid_value
      - forbidden
      - not_found
      - name_taken
      - rate_limited
      - internal
  /api/v1/passkey/register/finish:
    post:
      operationId: finishPasskeyRegistration
      tags: [Sign-in]
      summary: Finish registering and sign in
      description: |-
        **Who:** Whoever began the registration.

        Returns the eight recovery codes, once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyCreated'
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.PasskeyCreated
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignIn'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.SignIn
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 'Codes: `unauthenticated`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'Codes: `not_found`.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'Codes: `name_taken`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes:
      - invalid_request
      - invalid_value
      - unauthenticated
      - not_found
      - name_taken
      - rate_limited
      - internal
  /api/v1/access-key/register:
    post:
      operationId: registerWithAccessKey
      tags: [Sign-in]
      summary: Register a new account with an access key in place of a passkey
      description: |-
        **Who:** As `beginPasskeyRegistration`, while the server allows accounts without a passkey (setting `auth.allow_access_keys`). A claim link works in every registration mode.

        The page makes the access key, shows it once and has it confirmed before it calls this; the server is sent only the value derived from it. Makes the account (or claims the imported one) with that access key and no recovery codes, and signs it in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_key_auth]
              properties:
                invite_code:
                  type: string
                username:
                  type: string
                display_name:
                  type: string
                access_key_auth:
                  type: string
                  contentEncoding: base64url
                  description: The 32-byte value the page derives from the access key (AUTH.md section 5.6), never
                    the key itself.
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.RegisterWithAccessKeyRequest
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignIn'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.SignIn
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Codes: `forbidden`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'Codes: `not_found`.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'Codes: `name_taken`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes:
      - invalid_request
      - invalid_value
      - forbidden
      - not_found
      - name_taken
      - rate_limited
      - internal
  /api/v1/access-key/login:
    post:
      operationId: signInWithAccessKey
      tags: [Sign-in]
      summary: Sign in with a username and an access key
      description: |-
        **Who:** Anyone. A member or guest is refused with `forbidden` when member sign-in is `sso`; the owner and admins never are.

        Makes a session as a passkey sign-in does. Limited per address and per account. Any failure gives the same answer after the same work, whether or not the username exists. Existing access keys keep working when the server stops allowing new ones.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, access_key_auth]
              properties:
                username:
                  type: string
                access_key_auth:
                  type: string
                  contentEncoding: base64url
                  description: The 32-byte value the page derives from the access key (AUTH.md section 5.6), never
                    the key itself.
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.SignInWithAccessKeyRequest
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignIn'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.SignIn
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 'Codes: `unauthenticated`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Codes: `forbidden`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes:
      - invalid_request
      - invalid_value
      - unauthenticated
      - forbidden
      - rate_limited
      - internal
  /api/v1/passkey/login/begin:
    post:
      operationId: beginPasskeyLogin
      tags: [Sign-in]
      summary: Start a passkey sign-in
      description: '**Who:** Anyone. No username is needed.'
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ceremony'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.Ceremony
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes: [rate_limited, internal]
  /api/v1/passkey/login/finish:
    post:
      operationId: finishPasskeyLogin
      tags: [Sign-in]
      summary: Finish a passkey sign-in
      description: |-
        **Who:** Whoever began it. A member or guest is refused with `forbidden` when member sign-in is `sso`; the owner and admins never are.

        A passkey sign-in already counts as two factors and is never asked for a second. The error does not say which part was wrong.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CeremonyResult'
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.CeremonyResult
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignIn'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.SignIn
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '401':
          $ref: '#/components/responses/Unauthenticated'
