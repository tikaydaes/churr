      tags: [Sealed chats]
      summary: Replace the backup key and account key in one step
      description: |-
        **Who:** Any signed-in person, from the session a device is attached to. Not personal tokens.

        After a passkey that had a locked copy was removed, a device was revoked, the phrase was replaced, or because the person asked. The server swaps the account record, locked copies, records and device list together, deletes the old rows, clears "replacement due", and refuses a second replacement of the same version with `conflict`. The body may be up to 32 MB and carry up to 100,000 records (`too_large` beyond either).
