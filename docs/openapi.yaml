        Giving an ad-hoc channel a name makes it a named private channel; nothing else about it changes. `private` may only be set to true: a public channel can be made private, and people who are not members then lose it at once, history and search included. A private channel can never be made public. Welcome text, section and retention are for named channels. Channel names are not unique, and a name is never refused for being in use. A named channel may have a parent, another named channel, set with `parent_id`. One level only: a sub-channel cannot have sub-channels, and a channel that has sub-channels cannot be given a parent. Nothing is inherited: a sub-channel has its own members, levels, public or private setting, lock and retention, and joining a parent does not join its sub-channels. It is listed under its parent and takes the parent's section for display; its own `section_id` is ignored while it has a parent. The link is local to this server. The parent may be set or cleared by an account acting as manager of the sub-channel that is also a member of the parent, or by an admin (`forbidden` otherwise). Send `parent_id` as null to make the channel top-level. A parent that is not a named channel is refused with `invalid_value`. A parent that is itself a sub-channel, and giving a parent to a channel that has sub-channels, answer `conflict` (sub-channels go one level deep). Archiving, locking or making a parent private does nothing to its sub-channels, and if a parent is deleted they become top-level.
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'A channel name: 1 to 64 characters of any script. Spaces and capitals are allowed;
                    no control characters, no leading or trailing space, and runs of spaces are collapsed to one.
                    Not unique.'
                  minLength: 1
                  maxLength: 64
                topic:
                  type: string
                  description: Up to 250 characters.
                welcome:
                  type: string
                private:
                  type: boolean
                  description: Only `true`, as `access` `private`.
                access:
                  type: string
                  enum: [public, knock, private]
                  description: Ruling R79. Public and knock change into each other freely; either may become private;
                    a private channel never becomes public or knock (`forbidden`). Becoming knock or private from
                    public drops the channel for people who are not members, as making it private does. Knock is
                    for a top-level channel not shared with other servers. Managers set it.
                default_level:
                  type: string
                  enum: [reader, member]
                section_id:
                  type: string
                  format: uuid
                  description: One of the sections the admins defined.
                parent_id:
                  type: [string, 'null']
                  format: uuid
                  description: The named channel to put this one under, or null to clear it.
                retention_seconds:
                  type: integer
                  format: int64
                  description: 0 clears the channel's own period.
                slow_mode_seconds:
                  type: integer
                  format: int64
                broad_mentions:
                  type: string
                  enum: [server, anyone, managers]
                  description: Who may use `@channel`, `@here` and `@everyone` here. Managers set it.
                lazy_delivery:
                  type: string
                  enum: [server, 'on', 'off']
                  description: Whether the channel is delivered in full only to the connections that have it open.
                    Managers set it, in a named channel.
                announcement:
                  type: boolean
                  description: Make the channel an announcement channel, or an ordinary one again. Managers set
                    it, in a named channel that is not shared with other servers (`conflict` otherwise). Nobody's
                    level changes.
                announcement_replies:
                  type: boolean
                  description: Whether members who may not post may reply in threads. Only kept while the channel
                    is an announcement channel.
