          format: int64
      - name: until
        in: query
        description: Stop at this `seq`, to fill a gap.
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Default 50, at most 200.
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [events, has_more]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  has_more:
                    type: boolean
                  reload:
