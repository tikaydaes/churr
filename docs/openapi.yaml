        in: query
        description: Return the page centred on this `seq`, instead of `before` or `after`.
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/Before'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [messages, thread_states, has_more]
                properties:
                  messages:
                    type: array
                    items:
