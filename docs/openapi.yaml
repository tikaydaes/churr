      - invalid_request
      - unauthenticated
      - second_factor_required
      - session_locked
      - forbidden
      - not_found
      - rate_limited
      - internal
  /api/v1/admin/theme-defaults:
    put:
      operationId: setDefaultTheme
      tags: [Themes]
      summary: Set or clear the server's default dark or light theme
      description: |-
        **Who:** Admins (the owner included).

        With `theme_id`, the default of that kind becomes a copy of that theme, which must be of the kind (`invalid_value` otherwise); without, it is cleared. The defaults are in the server's description (`default_themes`), so `server.updated` tells everyone. In the audit log as `theme.default_set` or `theme.default_cleared`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [dark, light]
                theme_id:
                  type: string
                  format: uuid
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.SetDefaultThemeRequest
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [default_themes]
                properties:
                  default_themes:
                    $ref: '#/components/schemas/DefaultThemes'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.SetDefaultThemeResponse
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 'Codes: `unauthenticated`, `second_factor_required`, `session_locked`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Codes: `forbidden`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'Codes: `not_found`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes:
      - invalid_request
      - invalid_value
      - unauthenticated
      - second_factor_required
      - session_locked
      - forbidden
      - not_found
      - rate_limited
      - internal
components:
  securitySchemes:
    session_cookie:
      type: apiKey
      in: cookie
      name: churr_session
      description: A web session. The value starts `churr_ses_` and is accepted only in this cookie. HttpOnly, Secure,
        SameSite=Strict.
    bearer_token:
      type: http
      scheme: bearer
      description: An app access token (`churr_app_`), a personal token (`churr_pat_`) or a bot token (`churr_bot_`).
    integration_token:
      type: http
      scheme: bearer
      description: A server integration token (`churr_int_`). It works only on the `/api/v1/integration/` operations.
  parameters:
    Limit:
      name: limit
      in: query
      description: How many to return. Default 50, at most 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Opaque.
      schema:
        type: string
    Before:
      name: before
      in: query
      description: Only things with `seq` less than this.
      schema:
        type: integer
        format: int64
    After:
      name: after
      in: query
      description: Only things with `seq` greater than this.
      schema:
        type: integer
        format: int64
    PathId:
      name: id
      in: path
      required: true
      description: The identifier of the thing named just before it in the path.
      schema:
        type: string
        format: uuid
    PathAccountId:
      name: account_id
      in: path
      required: true
      description: An account.
      schema:
        type: string
        format: uuid
    PathGroupId:
      name: group_id
      in: path
      required: true
      description: A group.
      schema:
        type: string
        format: uuid
    PathMessageId:
      name: message_id
      in: path
      required: true
      description: A message.
      schema:
        type: string
        format: uuid
    PathConversationId:
      name: conversation_id
      in: path
      required: true
      description: A conversation.
      schema:
        type: string
        format: uuid
    PathServerId:
      name: server_id
      in: path
      required: true
      description: A known server.
      schema:
        type: string
        format: uuid
    PathTokenId:
      name: token_id
      in: path
      required: true
      description: A token.
      schema:
        type: string
        format: uuid
    PathTimeoutId:
      name: timeout_id
      in: path
      required: true
      description: A time-out.
      schema:
        type: string
        format: uuid
    PathKnockId:
      name: knock_id
      in: path
      required: true
      description: A request to be added to a channel.
      schema:
        type: string
        format: uuid
    PathProvider:
      name: provider
      in: path
      required: true
      description: A company sign-in provider.
      schema:
        type: string
        format: uuid
    PathInteractionId:
      name: interaction_id
      in: path
      required: true
      description: The `interaction_id` from an event the bot received.
      schema:
        type: string
        format: uuid
    PathEmoji:
      name: emoji
      in: path
      required: true
      description: The emoji itself, percent-encoded, `:name:` for a custom one, or `:name@server.name:` for another
        server's.
      schema:
        type: string
    PathItem:
      name: item
      in: path
      required: true
      description: A checklist item's `id`.
      schema:
        type: string
    PathButton:
      name: button
      in: path
      required: true
      description: A form button's `id`.
      schema:
        type: string
    PathToken:
      name: token
      in: path
      required: true
      description: The webhook secret, starting `churr_hook_`.
      schema:
        type: string
    PathName:
      name: name
      in: path
      required: true
      description: A name.
      schema:
        type: string
    PathCode:
      name: code
      in: path
      required: true
      description: A one-time code.
      schema:
        type: string
    PathKeyEpoch:
      name: key_epoch
      in: path
      required: true
      description: A sealed chat's key epoch.
      schema:
        type: integer
        format: int64
    PathIndex:
      name: index
      in: path
      required: true
      description: A position, from 0.
      schema:
        type: integer
        format: int64
    PathEventId:
      name: event_id
      in: path
      required: true
      description: The event identifier a wake-up carried.
      schema:
        type: string
  headers:
    RateLimit-Limit:
      description: Requests allowed in the current window.
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests left in the current window.
      schema:
        type: integer
    RateLimit-Reset:
      description: Seconds until the window resets.
      schema:
        type: integer
  responses:
    BadRequest:
      description: The request was malformed (`invalid_request`) or a field was wrong (`invalid_value`, with `field`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/x-protobuf:
          schema:
            type: string
            format: binary
          x-protobuf-message: churr.v1.Error
    Unauthenticated:
      description: 'No valid credential (`unauthenticated`), the session still owes a second factor (`second_factor_required`),
        or its holder locked it (`session_locked`): only unlocking and signing out are answered until a passkey
        unlocks it.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/x-protobuf:
          schema:
            type: string
            format: binary
          x-protobuf-message: churr.v1.Error
    Forbidden:
      description: 'The caller may not do this: `forbidden`, `timed_out`, `archived`, `locked`, `feature_off`, or
        `fresh_check_required` (pass a passkey or authenticator check, then try again).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/x-protobuf:
          schema:
            type: string
            format: binary
          x-protobuf-message: churr.v1.Error
    NotFound:
      description: '`not_found`. Also returned for things that exist and that the caller may not know exist.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/x-protobuf:
          schema:
            type: string
            format: binary
          x-protobuf-message: churr.v1.Error
    Conflict:
      description: '`conflict`, `name_taken` (usernames, group handles, emoji and command names, and reserved names;
        never a channel name) or `already_exists`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/x-protobuf:
          schema:
            type: string
            format: binary
          x-protobuf-message: churr.v1.Error
    TooLarge:
      description: '`too_large`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/x-protobuf:
          schema:
            type: string
            format: binary
          x-protobuf-message: churr.v1.Error
    Unprocessable:
      description: '`blocked_by_filter`: the word filter refused the message.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/x-protobuf:
          schema:
            type: string
            format: binary
          x-protobuf-message: churr.v1.Error
    TooManyRequests:
      description: '`rate_limited` or `slow_mode`, with `retry_after_seconds`.'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/x-protobuf:
          schema:
            type: string
            format: binary
          x-protobuf-message: churr.v1.Error
    ServerError:
      description: '`internal`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/x-protobuf:
          schema:
            type: string
            format: binary
          x-protobuf-message: churr.v1.Error
    Unavailable:
      description: '`unavailable`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/x-protobuf:
          schema:
            type: string
            format: binary
          x-protobuf-message: churr.v1.Error
  schemas:
    Error:
      type: object
      description: The error shape every failed request returns (CONVENTIONS.md, Errors).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
              - invalid_request
              - invalid_value
              - unauthenticated
              - second_factor_required
              - forbidden
              - timed_out
              - archived
              - locked
              - feature_off
              - fresh_check_required
              - not_found
              - conflict
              - name_taken
              - already_exists
              - too_large
              - blocked_by_filter
              - rate_limited
              - slow_mode
              - internal
              - unavailable
              description: What a client acts on.
            message:
              type: string
              description: A plain sentence a client may show. `name_taken` is for usernames, group handles, emoji
                and command names, and reserved names; never for a channel name, since those need not be unique.
            field:
              type: string
              description: 'With `invalid_value`: the request field that was wrong.'
            retry_after_seconds:
              type: integer
              format: int64
              description: With `rate_limited` and `slow_mode`.
    Server:
      type: object
      description: What a server says about itself before and after sign-in.
      required:
      - name
      - community_name
      - time_zone
      - version
      - min_app_version
      - setup_needed
      - sign_in
      - features
      - push_kinds
      - limits
      - default_themes
      properties:
        name:
          type: string
          description: The host name of the server's public address.
        community_name:
          type: string
          description: The community's display name (setting `server.name`).
        time_zone:
          type: string
          description: 'The server''s time zone (setting `server.time_zone`), an IANA name: the clients read typed
            times in it for an account with no time zone of its own.'
        icon_url:
          type: string
        version:
          type: string
        min_app_version:
          type: string
          description: The lowest app version this server supports.
        setup_needed:
          type: boolean
          description: True until the owner account has been made. Until then every other operation answers `unavailable`.
        sign_in:
          type: object
          required: [registration, member_sign_in, second_factor, access_keys, providers]
          properties:
            registration:
              type: string
              enum: [open, invite, closed]
            member_sign_in:
              type: string
              enum: [passkey, either, sso]
            second_factor:
              type: string
              enum: ['off', required]
            access_keys:
              type: boolean
              description: New accounts may be made with an access key in place of a passkey (setting `auth.allow_access_keys`).
            providers:
              type: array
              items:
                $ref: '#/components/schemas/SsoProviderSummary'
              description: Company sign-in providers that are switched on. Empty when member sign-in is `passkey`.
        features:
          type: object
          required:
          - sealed_chats
          - calls
          - link_previews
          - blocking
          - members_may_invite
          - members_may_add_emoji
          - broadcast_mentions_managers_only
          properties:
            sealed_chats:
              type: boolean
            calls:
              type: boolean
            link_previews:
              type: boolean
            blocking:
              type: boolean
            members_may_invite:
              type: boolean
            members_may_add_emoji:
              type: boolean
            broadcast_mentions_managers_only:
              type: boolean
              description: '`@channel`, `@here` and `@everyone` are limited to channel managers.'
          description: Features an admin can switch.
        push_kinds:
          type: array
          items:
            type: string
            enum: [apns, fcm, unifiedpush, none]
          description: The push kinds a device may register with. Always contains `none`. `apns` and `fcm` only
            while the relay is enabled and `push.relay_url` is set; `unifiedpush` only while its switch is on.
        limits:
          type: object
          required:
          - message_text
          - file_size
          - quick_correction_seconds
          - call_participants
          - call_cameras
          properties:
            message_text:
              type: integer
              format: int64
              description: Characters.
            file_size:
              type: integer
              format: int64
              description: Bytes.
            quick_correction_seconds:
              type: integer
              format: int64
            edit_window_seconds:
              type: integer
              format: int64
              description: Absent means no limit.
            retention_seconds:
              type: integer
              format: int64
              description: The server's retention period. Absent means messages are kept. Clients drop older messages
                from their own storage; no event is sent when retention removes one.
            call_participants:
              type: integer
              format: int64
            call_cameras:
              type: integer
              format: int64
        welcome:
          type: string
          description: The server welcome text, in Churr Markdown. Only sent to a signed-in caller.
        default_themes:
          $ref: '#/components/schemas/DefaultThemes'
          description: The server's default dark and light themes, for members who have not chosen their own. Sent
            before sign-in too, so a client can apply them at once.
    SsoProviderSummary:
      type: object
      description: A company sign-in provider as shown on the sign-in page.
      required: [id, kind, name]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [oidc, saml]
        name:
          type: string
          description: Shown on the sign-in button.
    WellKnown:
      type: object
      description: The document at `/.well-known/churr`, exactly as `docs/LINK-PROTOCOL.md` defines it. A hub serves
        the same document with `kind` `hub` and no box key.
      required: [churr, kind, name, sign_key, link]
      properties:
        churr:
          type: integer
          format: int64
          description: 'The document format: 1.'
        kind:
          type: string
          enum: [server, hub]
        name:
          type: string
          description: 'The server''s name: its public host name.'
        sign_key:
          type: string
          contentEncoding: base64url
          description: Ed25519 public key.
        box_key:
          type: string
          contentEncoding: base64url
          description: X25519 public key. Servers only.
        box_key_sig:
          type: string
          contentEncoding: base64url
          description: The signing key's signature over the box key, which ties the two together. Servers only.
        link:
          type: object
          required: [versions, url]
          properties:
            versions:
              type: array
              items:
                type: integer
                format: int64
              description: Link protocol versions spoken.
            url:
              type: string
              description: The address other servers and hubs dial.
          description: Where and how to link.
    Ceremony:
      type: object
      description: The start of a passkey step. `public_key` is passed to the browser's passkey API as it is.
      required: [ceremony_id, public_key]
      properties:
        ceremony_id:
          type: string
          description: Sent back with the result. Valid for five minutes, usable once.
        public_key:
          type: object
          additionalProperties: true
          description: WebAuthn options in their standard JSON form. Creation options always carry the `prf` extension
            input, so the new passkey is made with PRF where its store supports it. User verification is required.
    SessionUnlock:
      type: object
      description: The start of unlocking a locked session.
      required: [ceremony_id, access_key, unlock_url]
      properties:
        ceremony_id:
          type: string
          description: Sent back with the assertion or the access key. Valid for five minutes, usable once.
        public_key:
          type: object
          additionalProperties: true
          description: WebAuthn request options, limited to the account's own passkeys, user verification required.
            Absent when the account has no passkey.
        access_key:
          type: boolean
          description: The account has an access key, which unlocks too.
        unlock_url:
          type: string
          description: The server's page that runs the assertion, with the ceremony after the `#`. An app opens
            it in the system browser, because a passkey works only at the server's own web address (ruling R43).
    CeremonyResult:
      type: object
      description: The end of a passkey step.
      required: [ceremony_id, credential]
      properties:
        ceremony_id:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: 'The credential the passkey API returned, in its standard JSON form. The client removes any
            PRF output (`clientExtensionResults.prf.results`) before sending: the server never sees a PRF value.'
    PasskeyCreated:
      type: object
      description: The end of a passkey creation.
      required: [ceremony_id, credential]
      properties:
        ceremony_id:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: As in `CeremonyResult`.
        passkey_name:
          type: string
        prf_enabled:
          type: boolean
          description: What the browser reported in `prf.enabled`. A hint for the account page, not a security decision.
    Session:
      type: object
      description: One signed-in client, token or bot credential.
      required: [id, kind, label, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [web, app, personal, bot]
        label:
          type: string
        signed_in_by:
          type: string
          enum: [passkey, access_key, oidc, saml, recovery_code, recovery_link, pairing]
        second_factor:
          type: string
          enum: [passkey, totp, provider]
        pending_second_factor:
          type: boolean
          description: True while a second step is still owed. A pending session lasts ten minutes and can only
            list its proofs, give one, enrol a first one, and sign out.
        recovery:
          type: boolean
          description: True for a session made by a recovery code or link. It lasts one hour and can only read the
            profile, list and remove passkeys, list and revoke sessions, create a passkey or an access key, or (where
            company sign-in is required) link an identity.
        current:
          type: boolean
          description: This is the session making the request.
        locked_at:
          type: string
          format: date-time
          description: Set while its holder has locked it (the lock). A locked session can only unlock, with a passkey
            assertion of the account's own or its access key, and sign out.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Absent means until revoked.
    SignIn:
      type: object
      description: The result of a sign-in step. The response also sets the `churr_session` cookie, with a new token
        each time the session changes state.
      required: [session]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        account:
          $ref: '#/components/schemas/Me'
          description: Absent while a second factor is owed.
        second_factor:
          $ref: '#/components/schemas/SecondFactorState'
          description: Present when `session.pending_second_factor` is true.
        recovery_codes:
          type: array
          items:
            type: string
          description: Eight single-use codes, shown once, when an account's first passkey is created.
    AccessKey:
      type: object
      description: 'The caller''s access key: whether it exists and when it was made and used. Never the key.'
      required: [created_at]
      properties:
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    SecondFactorState:
      type: object
      description: The proofs a pending session may give.
      required: [accepted, set_up]
      properties:
        accepted:
          type: array
          items:
            type: string
            enum: [passkey, totp]
          description: The proofs the admin accepts that a person can give here. The provider's own statement was
            already looked at.
        set_up:
          type: array
          items:
            type: string
            enum: [passkey, totp]
          description: What this account already has. If empty, the person enrols one now, which counts as the proof.
    Passkey:
      type: object
      description: A passkey on the caller's account.
      required: [id, name, has_prf, can_unlock, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        has_prf:
          type: boolean
          description: False for a passkey from a store without PRF. It signs in but cannot unlock sealed chats.
        unlock_public:
          type: string
          contentEncoding: base64url
          description: The unlock public key derived from this passkey's PRF output, once the page that holds the
            passkey has given it.
        can_unlock:
          type: boolean
          description: A locked copy of the backup key exists for this passkey.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    Totp:
      type: object
      description: State of the authenticator-app code on the caller's account.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        confirmed_at:
          type: string
          format: date-time
    Identity:
      type: object
      description: A link between the caller's account and a company sign-in provider.
      required: [provider_id, provider_name, linked_at]
      properties:
        provider_id:
          type: string
          format: uuid
        provider_name:
          type: string
        linked_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    Token:
      type: object
      description: A personal or bot token as listed. The secret is shown only when it is made.
      required: [id, label, created_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    Device:
      type: object
      description: An app install or browser profile signed in to one account. Used for phone wake-ups and for sealed
        chats. A device outlives its session by up to 30 days.
      required: [id, name, platform, created_at]
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
          description: Absent while the device has no session.
        name:
          type: string
        platform:
          type: string
          enum: [android, ios, macos, windows, linux, web]
        push_kind:
          type: string
          enum: [apns, fcm, unifiedpush, none]
        push_address:
          type: string
          description: Device token or UnifiedPush endpoint. Only shown to the account that owns the device.
        wake_route:
          type: string
          description: Eleven characters the app keeps beside this server, to tell which server a wake-up came from
            (PUSH.md). Only shown to the account that owns the device.
        sign_key:
          type: string
          contentEncoding: base64url
          description: Its Ed25519 public key, published when the device registers for sealed chats.
        box_key:
          type: string
          contentEncoding: base64url
          description: 'The device box key: its X25519 public key.'
        retired_at:
          type: string
          format: date-time
          description: Set when the device had no session for 30 days or its session was revoked. An unlocked device
            of the account then takes it out of the device list.
        current:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
    DeviceInput:
      type: object
      description: Fields a client sets on its device.
      properties:
        name:
          type: string
        platform:
          type: string
          enum: [android, ios, macos, windows, linux, web]
        push_kind:
          type: string
          enum: [apns, fcm, unifiedpush, none]
        push_address:
          type: string
          description: Up to 4,096 characters.
        push_public_key:
          type: string
          contentEncoding: base64url
          description: 'For a UnifiedPush distributor that wants Web Push encryption: its 65-byte P-256 public key.
            Give it with `push_auth` or not at all.'
        push_auth:
          type: string
          contentEncoding: base64url
          description: The 16-byte Web Push auth secret that goes with `push_public_key`.
        sign_key:
          type: string
          contentEncoding: base64url
          description: Ed25519. Set once. A device with a different key is a new device.
        box_key:
          type: string
          contentEncoding: base64url
    Prefs:
      type: object
      description: Personal preferences saved on the server.
      required:
      - thread_view
      - meeting_pauses
      - hide_last_seen
      - auto_approve_direct
      - auto_approve_sealed
      - allow_notify_anyway
      properties:
        thread_view:
          type: string
          enum: [threaded, flat]
          description: The default view of threads. A conversation can override it.
        meeting_pauses:
          type: boolean
          description: Whether "in a meeting" also pauses notifications.
        hide_last_seen:
          type: boolean
          description: 'Nobody else is told roughly when the caller was last here: their `last_seen` is absent for
            everyone.'
        auto_approve_direct:
          type: boolean
          description: 'A new direct chat with the caller opens at once. Off (the default): it is a chat request
            the caller accepts, declines, dismisses or blocks (ruling R78). Existing chats are not affected.'
        auto_approve_sealed:
          type: boolean
          description: The same for a new sealed chat with the caller.
        allow_notify_anyway:
          type: boolean
          description: Whether senders may push one message through this person's do not disturb. Never shown to
            anyone else.
    Status:
      type: object
      description: The status a person or bot sets.
      required: [pause_notifications, appear_away]
      properties:
        emoji:
          type: string
          description: One standard emoji, or `:name:` for a custom one.
        text:
          type: string
          description: Up to 100 characters.
          maxLength: 100
        until:
          type: string
          format: date-time
          description: When it clears itself. Absent means until cleared.
        pause_notifications:
          type: boolean
          description: Do not disturb for as long as the status lasts.
        appear_away:
          type: boolean
          description: Appear away for as long as the status lasts.
    Availability:
      type: object
      description: In a meeting, or out of office.
      required: [value]
      properties:
        value:
          type: string
          enum: [meeting, out_of_office]
        until:
          type: string
          format: date-time
        set_by:
          type: string
          enum: [self, integration]
          description: Who set it.
    QuietHours:
      type: object
      description: The daily schedule that puts the account in do not disturb.
      required: [start, end, days, time_zone]
      properties:
        start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        end:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        days:
          type: string
          pattern: ^[01]{7}$
          description: 'Seven characters, Monday first, `1` for a day the schedule runs on: `1111100`.'
        time_zone:
          type: string
          description: IANA name. This is the account's `time_zone`.
        skip_until:
          type: string
          format: date-time
          description: 'Set while the next quiet period is being skipped: the end of that period.'
    Dnd:
      type: object
      description: The caller's do not disturb in detail. Other people see only the mark.
      required: ['on', sources]
      properties:
        'on':
          type: boolean
          description: True when any source is on.
        sources:
          type: array
          items:
            type: string
            enum: [manual, status, meeting, quiet]
          description: 'What is keeping it on now: a manual do not disturb, a status that pauses notifications,
            a meeting with the preference that pauses them, or quiet hours.'
        manual_until:
          type: string
          format: date-time
          description: 'With `manual`: when it ends. Absent means until turned off.'
        until:
          type: string
          format: date-time
          description: When do not disturb will end, if every source that is on has an end.
    StatusPreset:
      type: object
      description: A saved status.
      required: [id, community, text, pause_notifications, appear_away, position]
      properties:
        id:
          type: string
          format: uuid
        community:
          type: boolean
          description: True for a preset an admin defined for everyone.
        emoji:
          type: string
        text:
          type: string
        duration_seconds:
          type: integer
          format: int64
          description: Absent means until cleared.
        pause_notifications:
          type: boolean
        appear_away:
          type: boolean
        availability:
          type: string
          enum: [meeting, out_of_office]
        position:
          type: integer
          format: int64
    StatusPresetInput:
      type: object
      description: Fields of a saved status.
      properties:
        emoji:
          type: string
        text:
          type: string
        duration_seconds:
          type: integer
          format: int64
        pause_notifications:
          type: boolean
        appear_away:
          type: boolean
        availability:
          type: string
          enum: [meeting, out_of_office]
        position:
          type: integer
          format: int64
    StatusSummary:
      type: object
      description: Totals for the icon badge (PUSH.md section 11). The body holds no clock time, so it changes only
        when something changed.
      required: [badge, mentions, unread_conversations, unread_threads, dnd]
      properties:
        badge:
          type: integer
          format: int64
          description: 'The number for the app icon: the sum of the badges of the account''s conversations, each
            counted according to its mode. `show` plays no part: a hidden conversation counts like any other.'
        mentions:
          type: integer
          format: int64
          description: The sum of the conversations' mention counts, hidden ones included.
        unread_conversations:
          type: integer
          format: int64
          description: The account's conversations with anything unread, hidden ones included.
        unread_threads:
          type: integer
          format: int64
          description: Followed threads with unread replies.
        newest:
          type: string
          description: Opaque. Changes whenever something newer exists for this account.
        ringing_call_id:
          type: string
          format: uuid
          description: A call that is ringing for this account right now.
        dnd:
          type: boolean
          description: In do not disturb, from any cause.
        dnd_until:
          type: string
          format: date-time
          description: When that ends, if it is known.
        broadcast:
          $ref: '#/components/schemas/Broadcast'
          description: The server broadcast showing now (ruling R74), so that a client that connects while it shows
            shows it too. Absent when none is.
    WakeUp:
      type: object
      description: What a phone needs to draw one notification after a wake-up (PUSH.md section 9).
      required: [kind, conversation, messages, more, read, badge]
      properties:
        kind:
          type: string
          enum: [message, ring]
        conversation:
          type: object
          required: [id, kind]
          properties:
            id:
              type: string
              format: uuid
            kind:
              type: string
              enum: [channel, sealed]
            name:
              type: string
            title:
              type: string
              description: 'For an ad-hoc channel or sealed chat: the title to show, which is the other members''
                display names joined with commas.'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/WakeUpMessage'
          description: Messages in that conversation that notify this account and are after its read position, newest
            last, at most five. In a sealed chat they carry ciphertext.
        more:
          type: integer
          format: int64
          description: How many more there are beyond those.
        read:
          type: boolean
          description: The account's read position is already past the event.
        call:
          type: object
          required: [id, from_account_id, from_name, ringing]
          properties:
            id:
              type: string
              format: uuid
            from_account_id:
              type: string
              format: uuid
            from_name:
              type: string
            ringing:
              type: boolean
              description: Whether it should still ring.
          description: For a ring.
        badge:
          type: integer
          format: int64
          description: The account's total badge now.
    WakeUpMessage:
      type: object
      description: A message with its author's display name beside it.
      required: [message, author_name]
      properties:
        message:
          $ref: '#/components/schemas/Message'
        author_name:
          type: string
    OAuthTokens:
      type: object
      description: The token response of RFC 6749, with two additions.
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
          description: Starts `churr_app_`. Works for one hour.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Seconds. 3600.
        refresh_token:
          type: string
          description: 'Starts `churr_ref_`. Used once: each use returns a new pair.'
        device_id:
          type: string
          format: uuid
          description: The device row made for this app.
        handover:
          type: string
          contentEncoding: base64url
          description: The backup key sealed to the `box_key` the app sent, when the sign-in page could open it
            (SEALED.md). The server cannot read it.
    OAuthError:
      type: object
      description: The error shape of RFC 6749, used only by `/oauth/token` and `/oauth/revoke`.
      required: [error]
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_grant
          - unsupported_grant_type
          - authorization_pending
          - slow_down
        error_description:
          type: string
    Account:
      type: object
      description: A person, a bot, or the local shadow of someone on another server, as other accounts see it.
      required: [id, username, role, display_name, presence, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        server_name:
          type: string
          description: Home server, for an account from another server. Absent for a local account.
        role:
          type: string
          enum: [owner, admin, member, guest, bot, remote]
          description: '`remote` is the local shadow of an account on another server.'
        display_name:
          type: string
        avatar_file_id:
          type: string
          format: uuid
        avatar_url:
          type: string
        title:
          type: string
        pronouns:
          type: string
        time_zone:
          type: string
          description: IANA name.
        presence:
          type: string
          enum: [online, away, offline]
          description: Worked out by the server. `away` also when the person chose to appear away or is out of office.
        in_call:
          type: boolean
        last_seen:
          type: string
          enum: [online, recently, within_week, long_ago]
          description: 'Roughly when the person was last here, never a time: `online` now, `recently` within three
            days, `within_week`, or `long_ago`. Only on an account fetched by itself (`getAccount`), for a caller
            who is shown its presence; absent for a bot, for an account of another server, and when the person hides
            it (`hide_last_seen`). The server never sends the exact time to anyone else.'
        status:
          $ref: '#/components/schemas/Status'
        availability:
          $ref: '#/components/schemas/Availability'
        dnd:
          type: boolean
          description: The do not disturb mark. Nothing says why it is on, and nothing says whether the person accepts
            notify anyway.
        group_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Groups the account is in, for labels beside the name. Built-in groups are left out.
        claimed:
          type: boolean
          description: False for an imported account nobody has claimed yet.
        created_at:
          type: string
          format: date-time
        removed_at:
          type: string
          format: date-time
          description: Set for a former member.
    Me:
      description: 'The caller''s own account: the public shape plus what only they see.'
      allOf:
      - $ref: '#/components/schemas/Account'
      - type: object
        required: [prefs, dnd_state, passkey_count, has_access_key, has_totp, identity_count]
        properties:
          prefs:
            $ref: '#/components/schemas/Prefs'
          dnd_state:
            $ref: '#/components/schemas/Dnd'
          appear_away:
            type: object
            required: ['on']
            properties:
              'on':
                type: boolean
              until:
                type: string
                format: date-time
            description: The manual appear-away switch.
          quiet_hours:
            $ref: '#/components/schemas/QuietHours'
          passkey_count:
            type: integer
            format: int64
          has_access_key:
            type: boolean
          has_totp:
            type: boolean
          identity_count:
            type: integer
            format: int64
          blocked_ids:
            type: array
            items:
              type: string
              format: uuid
    Group:
      type: object
      description: A named set of local accounts with a handle.
      required:
      - id
      - handle
      - name
      - description
      - open
      - member_count
      - is_member
      - created_at
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        name:
          type: string
        description:
          type: string
        color:
          type: string
          enum: [lavender, cyan, pink, yellow, green, red, grey]
        open:
          type: boolean
          description: Members may join and leave it themselves.
        builtin:
          type: string
          enum: [everyone, admins]
          description: Set on the two built-in groups, which cannot be edited.
        member_count:
          type: integer
          format: int64
        is_member:
          type: boolean
          description: Whether the caller is in it.
        provider_id:
          type: string
          format: uuid
          description: 'Admins only: the provider this group is filled from.'
        provider_group:
          type: string
          description: 'Admins only: the provider''s group name.'
        created_at:
          type: string
          format: date-time
    Section:
      type: object
      description: A heading the admins define to group channels in the list.
      required: [id, name, position]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          format: int64
    Sidebar:
      type: object
      description: 'A person''s own sidebar (ruling R83): how they group and order this server''s conversations
        for themselves. Headings are named by keys: `p:<n>` one of their own sections, `s:<id>` an admin section,
        `s:` channels in no section, `chats`, `sealed`. Empty lists mean the server''s default.'
      required: [version, sections, headings, groups, placements, stars]
      properties:
        version:
          type: integer
          format: int64
          description: Goes up by one with every change. 0 until the first.
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SidebarSection'
          description: The person's own sections, oldest first.
        headings:
          type: array
          items:
            type: string
          description: 'The person''s order of channel headings. A heading missing from it goes after those in it,
            in the default order: own sections, then the admin''s in their order, then `s:`. Chats and Sealed are
            always last.'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SidebarGroup'
          description: Each heading whose sort is not the default.
        placements:
          type: array
          items:
            $ref: '#/components/schemas/SidebarPlacement'
          description: 'Conversations the person put in a section: their own, an admin''s, or `s:`. Any other sits
            where the server lists it.'
        stars:
          type: array
          items:
            type: string
            format: uuid
          description: The order of starred conversations, each at the top of its heading.
    SidebarSection:
      type: object
      description: One of a person's own sections.
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          description: Its number; its heading key is `p:<id>`.
        name:
          type: string
    SidebarGroup:
      type: object
      description: How one heading sorts.
      required: [key, sort, order]
      properties:
        key:
          type: string
        sort:
          type: string
          enum: [alphabetical, activity, custom]
          description: The default is alphabetical, and activity for `chats` and `sealed`.
        order:
          type: array
          items:
            type: string
            format: uuid
          description: The custom order. Conversations not in it follow, by name.
    SidebarPlacement:
      type: object
      description: A conversation the person put in a section other than where the server lists it.
      required: [conversation_id, key]
      properties:
        conversation_id:
          type: string
          format: uuid
        key:
          type: string
          description: 'The section: `p:<n>` one of their own, `s:<id>` an admin section, or `s:` (Channels).'
    SidebarOp:
      type: object
      description: One change to a sidebar. Which fields count depends on `op`.
      required: [op]
      properties:
        op:
          type: string
          enum:
          - create_section
          - rename_section
          - delete_section
          - move_section
          - set_sort
          - reorder
          - reset_section
          - reset_all
          - move
          - order_stars
          description: '`create_section` (name, index?), `rename_section` (key, name), `delete_section` (key: its
            conversations go back where the server lists them), `move_section` (key, index), `set_sort` (key, sort,
            ids?), `reorder` (key, ids: sets the custom order and the sort to custom), `reset_section` (key: back
            to the default sort), `reset_all` (everything back to the server''s default; stars stay), `move` (conversation_id,
            key: any section, the person''s own or an admin''s or `s:`, takes any conversation they are in; the
            heading where the server lists it puts it back there, and `chats` or `sealed` is refused for any other;
            ids? sets that heading''s custom order), `order_stars` (ids).'
        key:
          type: string
        name:
          type: string
          description: 1 to 64 characters.
        index:
          type: integer
          format: int64
          description: Where among the channel headings.
        sort:
          type: string
          enum: [alphabetical, activity, custom]
        conversation_id:
          type: string
          format: uuid
        ids:
          type: array
          items:
            type: string
            format: uuid
          description: Conversations the caller is in, at most 2000.
    Membership:
      type: object
      description: The caller's own place in a conversation, with the settings only they see.
      required:
      - level
      - via_group
      - joined_at
      - read_seq
      - mode
      - starred
      - may_post
      - ignore_broad_mentions
      - unread_count
      - mention_count
      - badge_count
      properties:
        level:
          type: string
          enum: [reader, member, manager]
        via_group:
          type: boolean
          description: In the channel through a group. Such a member cannot leave.
        direct:
          type: boolean
          description: Also added directly.
        joined_at:
          type: string
          format: date-time
        read_seq:
          type: integer
          format: int64
          description: The read position.
        mode:
          type: string
          enum: [any, mentions, nothing]
          description: 'What notifies: every message, mentions and followed threads, or nothing. Under `nothing`
            a mention of the account by name still counts in the badge. Says nothing about whether the conversation
            is shown.'
        muted_until:
          type: string
          format: date-time
          description: While set, the conversation behaves as `nothing`; `mode` is what returns afterwards.
        show:
          type: string
          enum: [always, activity, notification, hidden]
          description: 'Whether the conversation has a row in the person''s sidebar: always, only while it has unread
            messages, only while it has a badge, or never. Absent means the app''s own default, which is kept on
            the device. The server stores this and does not work out visibility; clients do. Independent of `mode`:
            a hidden conversation still notifies and still counts in badges and totals.'
        starred:
          type: boolean
        thread_view:
          type: string
          enum: [threaded, flat]
          description: Override of the account preference for this conversation.
        may_post:
          type: boolean
          description: A manager has allowed the caller to post here while the conversation is an announcement channel.
            Its managers, and an admin who acts as one, post without it.
        ignore_broad_mentions:
          type: boolean
          description: '`@channel`, `@here` and `@everyone` do not notify the caller here and are not counted as
            mentions of them. A mention by name or of another group still is.'
        unread_count:
          type: integer
          format: int64
          description: Unread messages. Replies are counted only in the flat view. Ignored threads never count.
        mention_count:
          type: integer
          format: int64
        badge_count:
          type: integer
          format: int64
          description: What the mode would have notified. The app badge is the sum of these over every conversation,
            whatever its `show`.
        timed_out_until:
          type: string
          format: date-time
          description: The caller is timed out here until then.
    Conversation:
      type: object
      description: A channel (named or ad-hoc) or a sealed chat.
      required:
      - id
      - kind
      - private
      - topic
      - default_level
      - slow_mode_seconds
      - broad_mentions
      - lazy_delivery
      - announcement
      - announcement_replies
      - large
      - created_at
      - last_seq
      - member_count
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [channel, sealed]
        private:
          type: boolean
          description: 'True for a knock channel and a private one: neither can be read or joined by someone outside
            it. A public channel can be made private or knock; a knock channel public again; a private one never
            either.'
        access:
          type: string
          enum: [public, knock, private]
          description: 'How someone outside comes in (ruling R79): public (join freely), knock (seen by owner, admin
            and member accounts, who ask to join with `knock`), private (invitation only). Absent for a sealed chat.'
        manager_ids:
          type: array
          items:
            type: string
            format: uuid
          description: The managers of a knock channel, sent only to someone outside it, who is shown nothing else
            of who is in it, of what is said, or of a call in progress.
        name:
          type: string
          description: 'Absent for an ad-hoc channel and for a sealed chat. Free-form: 1 to 64 characters of any
            script, spaces and capitals allowed. Not unique: any number of channels may share a name, and a channel
            is identified by its `id`. Clients sort and match names without regard to case.'
          minLength: 1
          maxLength: 64
        topic:
          type: string
        welcome:
          type: string
          description: Churr Markdown shown on joining.
        section_id:
          type: string
          format: uuid
          description: 'Ignored for display while the channel has a parent: a sub-channel is shown in its parent''s
            section.'
        parent_id:
          type: string
          format: uuid
          description: The named channel this one is a sub-channel of. One level only. Absent for a top-level channel,
            an ad-hoc channel and a sealed chat.
        default_level:
          type: string
          enum: [reader, member]
          description: '`reader` makes it an announcement channel.'
        retention_seconds:
          type: integer
          format: int64
          description: Absent means the server's period.
        slow_mode_seconds:
          type: integer
          format: int64
          description: 0 is off.
        broad_mentions:
          type: string
          enum: [server, anyone, managers]
          description: 'Who may use `@channel`, `@here` and `@everyone` here: `server` follows the server''s settings
            (its managers-only switch, and above `mentions.broad_mention_limit` members only the channel''s managers
            and the admins), `anyone` lets every member at level `member` or above whatever the channel''s size,
            `managers` only the accounts acting as manager. The server''s managers-only switch, when on, applies
            whatever this says.'
        lazy_delivery:
          type: string
          enum: [server, 'on', 'off']
          description: 'Whether the channel is delivered lazily: in full only to the live connections that have
            it open, with `conversation.changed` to the others (`docs/EVENTS.md` section 4.1). `server` follows
            `channels.large_channel_limit`; `on` and `off` decide whatever its size. Always `server` outside a named
            channel.'
        announcement:
          type: boolean
          description: 'An announcement channel: only its managers and the members they allow (`setMemberMayPost`)
            post; the others read and react, are not shown who else is in it, and nobody is shown typing or presence
            there.'
        announcement_replies:
          type: boolean
          description: In an announcement channel, whether members at level `member` or above who may not post may
            still reply in threads. Off unless a manager turns it on.
        large:
          type: boolean
          description: 'The conversation has more members than `channels.large_feature_limit`, or is an announcement
            channel: typing notices are not sent, and a client shows an online count (`presence.counts`) in place
            of each member''s presence. Worked out when the conversation is sent; it can go out of date as people
            join and leave.'
        broad_mentions_allowed:
          type: boolean
          description: Whether the caller may use `@channel`, `@here` and `@everyone` here now. Present with `membership`;
            absent in a conversation sent to everyone in an event, where a client keeps the value it holds. It can
            go out of date as the channel grows; `checkBroadMentions` and the answer to `postMessage` are always
            right.
        locked_at:
          type: string
          format: date-time
          description: 'Set on a private channel that has been locked: nobody can be added or join, and someone
            who leaves cannot return. Never cleared.'
        created_by_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        last_seq:
          type: integer
          format: int64
          description: The newest event number.
        last_message_at:
          type: string
          format: date-time
        member_count:
          type: integer
          format: int64
        member_ids:
          type: array
          items:
            type: string
            format: uuid
          description: For ad-hoc channels and sealed chats only, so a client can title them.
        moved_from_message_id:
          type: string
          format: uuid
          description: The message whose thread this channel was made from.
        ticket_number:
          type: integer
          format: int64
        shared:
          type: object
          required: [stream_id, owner_server, servers]
          properties:
            stream_id:
              type: string
              format: uuid
            owner_server:
              type: string
            servers:
              type: array
              items:
                type: string
            max_blob_bytes:
              type: integer
              format: int64
          description: Present when the conversation is shared with other servers.
        read_only:
          type: boolean
          description: 'Nothing can be posted: a conversation with people on another server that is no longer linked,
            a sealed chat while sealed chats are off, or one whose other person was removed.'
        chat_state:
          type: string
          enum: [waiting, declined, closed]
          description: 'A direct or sealed chat that cannot be written in (rulings R78, R79): `waiting` while the
            chat request that started it waits for the other person, `declined` once they declined it, `closed`
            once either person closed it. Absent while it is open. It never says who closed a chat.'
        key_epoch:
          type: integer
          format: int64
          description: 'Sealed chats: the current key epoch. A message must be encrypted in it.'
        call:
          $ref: '#/components/schemas/Call'
          description: The call in progress, if there is one.
        membership:
          $ref: '#/components/schemas/Membership'
          description: Absent when the caller is not a member, as when browsing a public channel.
    Member:
      type: object
      description: An account in a conversation.
      required: [conversation_id, account_id, level, via_group, may_post, joined_at]
      properties:
        conversation_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        level:
          type: string
          enum: [reader, member, manager]
          description: The highest of the direct level and the levels of the member's groups.
        direct_level:
          type: string
          enum: [reader, member, manager]
          description: Absent for a member who is in only through groups.
        via_group:
          type: boolean
        may_post:
          type: boolean
          description: A manager has allowed this member to post while the conversation is an announcement channel.
        joined_at:
          type: string
          format: date-time
    ChannelGroup:
      type: object
      description: A group added to a channel at a level.
      required: [conversation_id, group_id, level, added_at]
      properties:
        conversation_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        level:
          type: string
          enum: [reader, member, manager]
        added_by_id:
          type: string
          format: uuid
        added_at:
          type: string
          format: date-time
    Pin:
      type: object
      description: A pinned message.
      required: [message_id, pinned_by_id, pinned_at]
      properties:
        message_id:
          type: string
          format: uuid
        pinned_by_id:
          type: string
          format: uuid
        pinned_at:
          type: string
          format: date-time
        message:
          $ref: '#/components/schemas/Message'
    Timeout:
      type: object
      description: 'A time-out: the account can read but cannot post or react.'
      required: [id, account_id, until, reason, created_by_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
          description: Absent for a time-out on the whole server.
        until:
          type: string
          format: date-time
        reason:
          type: string
        created_by_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        lifted_at:
          type: string
          format: date-time
    TimeoutInput:
      type: object
      description: A new time-out.
      required: [account_id, seconds]
      properties:
        account_id:
          type: string
          format: uuid
        seconds:
          type: integer
          format: int64
        reason:
          type: string
    Report:
      type: object
      description: A report of a message.
      required: [id, message_id, conversation_id, source, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        source:
          type: string
          enum: [person, filter]
          description: '`filter` when the word filter flagged the message.'
        reported_by_id:
          type: string
          format: uuid
          description: Absent when the word filter flagged the message.
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        handled_by_id:
          type: string
          format: uuid
        handled_at:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [dismissed, deleted, timed_out]
          description: Absent while waiting.
        message:
          $ref: '#/components/schemas/Message'
    Quote:
      type: object
      description: What a reply quotes. No range means the whole message.
      required: [message_id]
      properties:
        message_id:
          type: string
          format: uuid
        start:
          type: integer
          format: int64
          description: UTF-16 code units into the quoted text.
        end:
          type: integer
          format: int64
    Entity:
      type: object
      description: Something the server resolved in the text. `at` and `len` count UTF-16 code units. A channel
        link is written `<#conversation-id>` in the text and becomes a `conversation` entity whose `at` and `len`
        cover the whole `<#…>`; clients draw it as the channel's current name. `#name` typed as plain characters
        is plain text and is never resolved.
      required: [type, at, len]
      properties:
        type:
          type: string
          enum:
          - account
          - group
          - broadcast
          - conversation
          - emoji
          - link
          - task
          - instant
          - reference
          - message_link
          - measure
          - colour
          - event
          - phone
          - email
          - geo
          - dice
          - number
          - codepoint
        at:
          type: integer
          format: int64
        len:
          type: integer
          format: int64
        account_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [channel, here]
        conversation_id:
          type: string
          format: uuid
        emoji_id:
          type: string
          format: uuid
        url:
          type: string
        item_id:
          type: string
        time:
          type: string
          format: date-time
          description: 'For `instant`: the moment the typed date and time names, in UTC (ruling R69). `at` is the
            position, so the moment is `time`.'
        precision:
          type: string
          enum: [minute, second]
          description: 'For `instant` and `event`: what the author typed down to.'
        zone:
          type: string
          description: 'For `instant`: the zone as written (`Z`, an offset such as `+10:00`, or an IANA name), or
            the author''s IANA zone when none was written.'
        pattern_id:
          type: string
          format: uuid
          description: 'For `reference`: the reference pattern that matched (ruling R73). The pattern may since
            have been changed or removed.'
        value:
          type: string
          description: 'For `reference`: the value matched after the pattern''s prefix. The address it resolved
            to when the text was written is `url`. For `measure`: the number as typed, with `-` for a minus sign.
            For `colour`: the colour as `#rrggbb` or `#rrggbbaa`, lower case. For `phone`: `+` and the digits. For
            `email`: the address as typed. For `dice`: the roll written out in full (`2d6+3`). For `number`: the
            number in decimal (below 2^128). For `codepoint`: `U+` and at least four upper-case hex digits; its
            name is looked up with `lookupCodePoints`.'
        base:
          type: integer
          format: int64
          description: 'For `number`: the base it was typed in: 16, 2 or 8.'
        end:
          type: string
          format: date-time
          description: 'For `event`: when it ends, in UTC; it starts at `time`, and `precision` and `zone` are for
            both (ruling R73).'
        lat:
          type: string
          description: 'For `geo`: the latitude in decimal degrees, as typed (-90 to 90).'
        lon:
          type: string
          description: 'For `geo`: the longitude in decimal degrees, as typed (-180 to 180).'
        terms:
          type: array
          items:
            $ref: '#/components/schemas/DiceTerm'
          description: 'For `dice`: each term as it fell, drawn by the server when the message was posted (ruling
            R73).'
        total:
          type: integer
          format: int64
          description: 'For `dice`: the result.'
        removed:
          type: boolean
          description: 'For `dice`: an edit wrote or changed these dice, and nothing was rolled for them.'
        unit:
          type: string
          description: 'For `measure`: the unit''s code in the fixed table of MESSAGE-FORMAT.md section 3.2 (`km`,
            `mi`, `°C`, `lb`, `l`, `mph`, …).'
        message_id:
          type: string
          format: uuid
          description: 'For `message_link`: the message the link names; its conversation is `conversation_id` and
            the link as typed `url`. The entity holds nothing of the message: a client fetches it with `getMessage`,
            which answers only a reader who may see it.'
    CodePointName:
      type: object
      description: A Unicode code point's name and general category (`lookupCodePoints`).
      required: [code_point, name, category, category_name]
      properties:
        code_point:
          type: string
          description: '`U+` and at least four upper-case hex digits.'
        name:
          type: string
          description: The character's name, such as `GRINNING FACE`. For a control character, its Unicode 1 name
            (`LINE FEED (LF)`) where it has one; for an unassigned code point or a private-use one without a name,
            empty.
        category:
          type: string
          description: The general category, two letters (`So`, `Lu`, `Cn` when unassigned).
        category_name:
          type: string
          description: The general category in words, such as `Other Symbol`.
    ObjectHint:
      type: object
      description: 'What the author chose in the composer for a range of the text (ruling R73). `plain` keeps the
        range as plain text: no object is recognised in it or reaching into it. Any other kind is an entity type
        the range is to be read as, where it could be more than one. A hint that does not fit the text is ignored
        without an error.'
      required: [start, end, kind]
      properties:
        start:
          type: integer
          format: int64
          description: UTF-16 code units.
        end:
          type: integer
          format: int64
          description: UTF-16 code units, after the last.
        kind:
          type: string
          enum:
          - plain
          - reference
          - message_link
          - measure
          - colour
          - phone
          - email
          - geo
          - dice
          - number
          - codepoint
    ReferencePattern:
      type: object
      description: 'A pattern that turns text into a reference (ruling R73): `prefix` followed at once by a value.
        One with no `conversation_id` is the server''s and applies everywhere; one with applies in that channel,
        ahead of the server''s.'
      required: [id, name, prefix, url_template, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: '1 to 16 letters, digits and `# _ . / : -`, such as `PROJ-` or `#`. Not ending in a digit;
            one with no letter or digit in it starts with `#`.'
        expression:
          type: string
          description: 'What the value matches, in the restricted form of MESSAGE-FORMAT.md section 3.2. Absent:
            1 to 12 digits.'
        url_template:
          type: string
          description: An http or https address with `{value}` where the value goes.
        created_by_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    ReferencePatternInput:
      type: object
      description: Fields of a reference pattern. A change may leave any out.
      properties:
        conversation_id:
          type: string
          format: uuid
          description: 'On create only: the channel the pattern is for. Absent: the server''s.'
        name:
          type: string
          description: 1 to 64 characters.
        prefix:
          type: string
        expression:
          type: string
          description: At most 64 characters. Empty for digits.
        url_template:
          type: string
          description: At most 500 characters.
    InstantHint:
      type: object
      description: 'A range of the text the author''s client resolved to an instant: a phrase such as "this Friday
        at 5pm" the author accepted in the composer (ruling R69). The server stores each hint that holds up as an
        `instant` entity and drops the rest without an error: the range must lie inside one run of plain text (not
        in code, a link''s text, across formatting marks or over another entity) on character boundaries; `time`
        must be an RFC 3339 instant in the years 1000 to 9999; `zone` an offset or a known IANA name.'
      required: [start, end, time, precision, zone]
      properties:
        start:
          type: integer
          format: int64
          description: UTF-16 code units.
        end:
          type: integer
          format: int64
          description: UTF-16 code units, after the last.
        time:
          type: string
          format: date-time
        precision:
          type: string
          enum: [minute, second]
        zone:
          type: string
          description: An offset (`Z`, `+10:00`) or an IANA name.
    Task:
      type: object
      description: The state of one checklist item.
      required: [id, checked]
      properties:
        id:
          type: string
          description: Unique within the message.
          pattern: ^[a-z0-9_-]{1,32}$
        checked:
          type: boolean
        checked_by_id:
          type: string
          format: uuid
        checked_at:
          type: string
          format: date-time
    File:
      type: object
      description: An uploaded file.
      required: [id, name, size, media_type, kind]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        size:
          type: integer
          format: int64
          description: Bytes.
        media_type:
          type: string
          description: Decided by the server from the content.
        kind:
          type: string
          enum: [image, video, audio, text, file]
        width:
          type: integer
          format: int64
        height:
          type: integer
          format: int64
        duration_seconds:
          type: integer
          format: int64
        caption:
          type: string
        preview_text:
          type: string
          description: 'For `text`: the first 20 lines.'
        url:
          type: string
          description: Only a `ready` file has one.
        thumb_url:
          type: string
        poster_url:
          type: string
          description: 'For a video: the poster image the uploading client sent. The server makes none.'
        state:
          type: string
          enum: [ready, arriving, unavailable, too_large]
          description: For a file from another server in a shared conversation. Absent means `ready`.
    CardField:
      type: object
      description: A label and value on a card.
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
          description: Inline Churr Markdown.
        short:
          type: boolean
    Card:
      type: object
      description: A fixed layout for structured information. A card must have at least a title, text or image.
      properties:
        color:
          type: string
          enum: [lavender, cyan, pink, yellow, green, red, grey]
        author:
          type: object
          required: [name]
          properties:
            name:
              type: string
            icon_file_id:
              type: string
              format: uuid
        title:
          type: string
          description: Plain text.
          maxLength: 200
        url:
          type: string
          format: uri
        text:
          type: string
          description: Churr Markdown, inline constructs and lists only.
          maxLength: 4000
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CardField'
          description: Up to ten.
          maxItems: 10
        image_file_id:
          type: string
          format: uuid
        footer:
          type: string
        at:
          type: string
          format: date-time
        preview_url:
          type: string
          format: uri
          description: 'Set by the server on a link preview: the address it previews. A card without it was posted
            by a bot or webhook.'
        theme:
          $ref: '#/components/schemas/CardTheme'
          description: 'Set by the server on a theme card: the card for a link to one of its own themes (`{origin}/themes/{id}`).
            It also has `preview_url` and is removed like a link preview. A client draws its swatches and offers
            to try and to add it.'
    FormOption:
      type: object
      description: One option of a choice field.
      required: [id, label]
      properties:
        id:
          type: string
          description: Unique within the field.
          pattern: ^[a-z0-9_-]{1,32}$
        label:
          type: string
        max:
          type: integer
          format: int64
          description: Places for this option, used by the sign-up preset.
        added_by_id:
          type: string
          format: uuid
          description: Set on an option an answerer added.
    FormField:
      type: object
      description: One field of a form.
      required: [id, type, label]
      properties:
        id:
          type: string
          description: Unique within the form.
          pattern: ^[a-z0-9_-]{1,32}$
        type:
          type: string
          enum:
          - choice
          - text
          - longtext
          - number
          - date
          - time
          - account
          - conversation
          - checkbox
        label:
          type: string
        help:
          type: string
        required:
          type: boolean
        multiple:
          type: boolean
          description: For `choice`, `account` and `conversation`.
        options:
          type: array
          items:
            $ref: '#/components/schemas/FormOption'
          description: For `choice`. Up to 50.
          maxItems: 50
        min:
          description: For `choice` the fewest options to pick; for `number` and `date` the lowest value.
        max:
          description: For `choice` the most options to pick; for `number` and `date` the highest value.
        step:
          type: number
        placeholder:
          type: string
        max_length:
          type: integer
          format: int64
    FormButton:
      type: object
      description: A button on a form.
      required: [id, label]
      properties:
        id:
          type: string
          description: Unique within the form.
          pattern: ^[a-z0-9_-]{1,32}$
        label:
          type: string
        style:
          type: string
          enum: [default, primary, danger]
        group_id:
          type: string
          format: uuid
          description: 'For the `group` action: the open group this button is for.'
        group_action:
          type: string
          enum: [join, leave]
          description: 'For the `group` action: what this button does.'
    FormAction:
      type: object
      description: What the server does with an answer.
      required: [type]
      properties:
        type:
          type: string
          enum: [tally, collect, thread, channel, group, bot]
        name_prefix:
          type: string
          description: For `channel`.
        group_id:
          type: string
          format: uuid
          description: 'For `channel`: the group put in the new channel with the answerer.'
        level:
          type: string
          enum: [reader, member, manager]
          description: 'For `channel`: the level the group is added at.'
    FormInput:
      type: object
      description: A form as a client sends it when posting a message.
      required: [fields, action]
      properties:
        preset:
          type: string
          enum: [poll, rsvp, signup, approve, checkin, ticket, roles]
          description: Tells clients how to draw it. Absent for a form made with the builder.
        title:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
          description: Up to 20.
          maxItems: 20
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/FormButton'
          description: Up to five.
          maxItems: 5
        action:
          $ref: '#/components/schemas/FormAction'
        anonymous:
          type: boolean
          description: Cannot be changed after posting. Only with `tally` and `collect`; never on a `bot` form.
        results:
          type: string
          enum: [live, after_answer, after_close]
          description: For `tally` only.
        allow_added_options:
          type: boolean
        answerer_group_id:
          type: string
          format: uuid
          description: Only members of this group may answer or press. Only an account acting as manager of the
            conversation may set it. Refused in a conversation shared with other servers, from a webhook and in
            a dialog.
        one_answer:
          type: boolean
          description: Default true. False allows many answers per account, for `thread` and `channel` actions.
        closes_at:
          type: string
          format: date-time
    Form:
      type: object
      description: How a message asks for input. One per message.
      required: [id, fields, action, answer_count]
      properties:
        id:
          type: string
          format: uuid
        preset:
          type: string
          enum: [poll, rsvp, signup, approve, checkin, ticket, roles]
          description: Tells clients how to draw it. Absent for a form made with the builder.
        title:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
          description: Up to 20.
          maxItems: 20
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/FormButton'
          description: Up to five.
          maxItems: 5
        action:
          $ref: '#/components/schemas/FormAction'
        anonymous:
          type: boolean
          description: Cannot be changed after posting. Only with `tally` and `collect`; never on a `bot` form.
        results:
          type: string
          enum: [live, after_answer, after_close]
          description: For `tally` only.
        allow_added_options:
          type: boolean
        answerer_group_id:
          type: string
          format: uuid
          description: Only members of this group may answer or press. Only an account acting as manager of the
            conversation may set it. Refused in a conversation shared with other servers, from a webhook and in
            a dialog.
        one_answer:
          type: boolean
          description: Default true. False allows many answers per account, for `thread` and `channel` actions.
        closes_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        answer_count:
          type: integer
          format: int64
        tally:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
              format: int64
          description: Counts by field id, then option id. Present only when `results` allows it for the reader.
        voters:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
                format: uuid
          description: Account ids by field id, then option id. Present only when `results` allows it. Never present
            on an anonymous form.
        my_answer:
          $ref: '#/components/schemas/Answers'
          description: The reader's own answer. Never sent to anyone else.
    Answers:
      type: object
      description: Values by field id. `choice`, `account` and `conversation` fields hold a list of ids; `text`
        and `longtext` a string; `number` a number; `date` `YYYY-MM-DD`; `time` `HH:MM`; `checkbox` true or false.
      additionalProperties: true
    FormAnswer:
      type: object
      description: One stored answer to a form.
      required: [id, answers, created_at]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
          description: Absent on an anonymous form.
        button_id:
          type: string
        answers:
          $ref: '#/components/schemas/Answers'
        created_at:
          type: string
          format: date-time
          description: On an anonymous form, the form's own creation time, so that nothing tells when an answer
            was given.
        updated_at:
          type: string
          format: date-time
    Reaction:
      type: object
      description: One emoji on a message, with the accounts behind it.
      required: [emoji, count, me, account_ids]
      properties:
        emoji:
          type: string
          description: A standard emoji sequence, `:name:` for a custom one, or `:name@server.name:` for another
            server's.
        count:
          type: integer
          format: int64
        me:
          type: boolean
          description: The reader reacted with it.
        account_ids:
          type: array
          items:
            type: string
            format: uuid
          description: At most the first ten.
    ThreadSummary:
      type: object
      description: Thread information on a top-level message that has replies.
      required: [reply_count, last_reply_seq, last_reply_order, last_reply_at, participant_ids]
      properties:
        reply_count:
          type: integer
          format: int64
        last_reply_seq:
          type: integer
          format: int64
          description: The seq of the newest reply that is not deleted.
        last_reply_order:
          type: string
          description: The `order` of that reply, so the thread's marker can be placed without holding the reply.
        last_reply_at:
          type: string
          format: date-time
        participant_ids:
          type: array
          items:
            type: string
            format: uuid
    Via:
      type: object
      description: How a message was posted, if not typed by its author.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [webhook, reminder, scheduled, command, import, system]
        name:
          type: string
        account_id:
          type: string
          format: uuid
          description: 'Who caused it: the person who sent a command a bot answered.'
        icon_file_id:
          type: string
          format: uuid
          description: A webhook's icon for this message.
    SystemNotice:
      type: object
      description: 'In place of text on a message the server posted itself. Other fields depend on `kind`: `call_id`
        for calls, `conversation_id` for `thread_moved` (the new channel), `name` for `channel_renamed`, `message_id`
        for `pinned`, `by_id` where someone else caused it. Clients word these themselves.'
      required: [kind]
      properties:
        kind:
          type: string
          enum:
          - member_joined
          - member_left
          - call_started
          - call_ended
          - thread_moved
          - channel_renamed
          - pinned
        call_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        by_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        name:
          type: string
        duration_seconds:
          type: integer
          format: int64
        participant_ids:
          type: array
          items:
            type: string
            format: uuid
      additionalProperties: true
    SealedPayload:
      type: object
      description: The content of a sealed-chat message. Only the two people's devices can open it.
      required: [key_epoch, ciphertext]
      properties:
        key_epoch:
          type: integer
          format: int64
          description: The key epoch it was encrypted in.
        ciphertext:
          type: string
          contentEncoding: base64url
          description: At most 128 KB.
    DiceTerm:
      type: object
      description: 'One term of a roll: some dice, or a plain number added or taken away.'
      required: [sign, value]
      properties:
        sign:
          type: integer
          format: int64
          description: 1 to add the term, -1 to take it away.
        count:
          type: integer
          format: int64
          description: 'Dice only: how many.'
        sides:
          type: integer
          format: int64
          description: 'Dice only: the sides of each die.'
        keep:
          type: string
          enum: [kh, kl, dh, dl]
          description: Keep highest, keep lowest, drop highest, drop lowest.
        keep_n:
          type: integer
          format: int64
          description: How many are kept or dropped.
        rolls:
          type: array
          items:
            type: integer
            format: int64
          description: Each die as it fell, in order.
        dropped:
          type: array
          items:
            type: integer
            format: int64
          description: Positions in `rolls` that do not count.
        value:
          type: integer
          format: int64
          description: A plain number's value, or the sum of the dice that count. The sign is not applied to it.
    Chance:
      type: object
      description: A result the server drew for `/roll`, `/flip`, `/pick`, `/shuffle`, `/draw`, `/mahjongg` or `/tarot`
        (MESSAGE-FORMAT.md section 1.2). No edit changes it.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [roll, flip, pick, shuffle, draw, tarot]
        dice:
          type: string
          description: 'A roll: the expression as the server read it, written out in full (`d20` is `1d20`, `adv`
            is `2d20kh1`).'
        terms:
          type: array
          items:
            $ref: '#/components/schemas/DiceTerm'
          description: 'A roll: each term with its dice.'
        total:
          type: integer
          format: int64
          description: 'A roll: the total.'
        outcome:
          type: string
          enum: [heads, tails]
          description: A flip.
        options:
          type: array
          items:
            type: string
          description: 'A pick or shuffle: the options as given.'
        picked:
          type: integer
          format: int64
          description: 'A pick: the position in `options` of the one picked.'
        order:
          type: array
          items:
            type: integer
            format: int64
          description: 'A shuffle: the positions in `options`, in the order the shuffle put them.'
        deck:
          type: string
          description: 'A draw or tarot reading: the name of the deck (testdata/commands/decks.json).'
        cards:
          type: array
          items:
            type: string
          description: 'A draw: the cards drawn, in order, by code. A tarot reading: the card in each position of
            the spread.'
        reversed:
          type: array
          items:
            type: boolean
          description: 'A draw from a deck with orientation, and a tarot reading: whether each card came up reversed.'
        spread:
          type: string
          description: 'A tarot reading: the spread (testdata/commands/tarot.json).'
    ChanceInput:
      type: object
      description: Asks the server to draw a result. People only; refused in a sealed chat.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [roll, flip, pick, shuffle, draw, tarot]
        dice:
          type: string
          description: 'A roll: the expression (FEATURES.md section 12.4). Empty is `1d20`.'
          maxLength: 100
        options:
          type: array
          items:
            type: string
          description: 'A pick or shuffle: 2 to 20 options of up to 200 characters.'
          maxItems: 20
        count:
          type: integer
          format: int64
          description: 'A draw: how many cards. Default 1.'
        deck:
          type: string
          description: 'A draw: the deck, by name or alias. Default `standard`.'
        spread:
          type: string
          description: 'A tarot reading: the spread, by name or alias. Default `three`.'
    Message:
      type: object
      description: One post in a conversation, in the shape MESSAGE-FORMAT.md defines. In a sealed chat only `id`,
        `conversation_id`, `seq`, `order`, `author_id`, `client_id`, `sealed`, `quiet` and `created_at` are present,
        `late` and `unsent` where they apply, and `deleted_at` once deleted.
      required: [id, conversation_id, seq, author_id, order, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          description: 'The number of the event that created it: the message''s arrival number on this server. It
            serves catch-up, read positions and unread counts. It does not say where the message is shown: `order`
            does.'
        author_id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
          description: 'Sealed chats: the reference the sending device made. References inside sealed content use
            it.'
        parent_id:
          type: string
          format: uuid
          description: The top-level message this replies to.
        quote:
          $ref: '#/components/schemas/Quote'
        text:
          type: string
          description: Churr Markdown, exactly as the author sent it.
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        form:
          $ref: '#/components/schemas/Form'
        action:
          type: boolean
          description: The text says what the author is doing (typed with `/me`); drawn after the author's name.
        chance:
          $ref: '#/components/schemas/Chance'
        fallback:
          type: string
          description: Plain text the server wrote to stand in for the cards, form and chance result.
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Reaction'
        thread:
          $ref: '#/components/schemas/ThreadSummary'
        via:
          $ref: '#/components/schemas/Via'
        system:
          $ref: '#/components/schemas/SystemNotice'
        sealed:
          $ref: '#/components/schemas/SealedPayload'
        quiet:
          type: boolean
          description: 'Sealed chats: the sender marked it as not an ordinary message (a reaction, tick, edit or
            delete), so it does not notify or count as unread.'
        pinned:
          type: boolean
        notified_anyway:
          type: boolean
          description: The author used "notify anyway" on it. Says nothing about whether anyone was reached.
        has_history:
          type: boolean
        unsent:
          type: boolean
          description: 'In a conversation shared with other servers, on a message of this server''s own: the link
            has not yet acknowledged it. It is stored, has its `seq` and `order`, and is shown in its place all
            the same. `message.sent` says when it no longer applies.'
        order:
          type: string
          description: 'Where the message is shown. Clients always show a conversation, and a thread, sorted by
            `order`, compared as plain text, character by character. It is opaque: nothing else may be read out
            of it. In a conversation that is not shared it follows `seq`. In one that is shared with other servers
            it is made from the time, by the clock all its servers share, at which the message was posted, and is
            the same on every server; it need not follow `seq`. It can change after the fact, in which case `message.placed`
            says so.'
        late:
          type: boolean
          description: 'In a shared conversation: the message arrived on this server after messages ordered later
            than it had already been delivered here, for example because its server was cut off for a while. It
            takes its place by `order` all the same, and counts as unread like any new message: its `seq` is above
            what was read.'
        created_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          description: Set on a deleted message. Its text, files, cards and form are then empty.
        deleted_by_id:
          type: string
          format: uuid
    MessageInput:
      type: object
      description: A new message. It needs at least one of text, a file, a card, a form, a chance request, or `sealed`.
      properties:
        client_id:
          type: string
          format: uuid
          description: Made by the client. Sending the same one again in the same conversation within 24 hours returns
            the message already created. Required in a sealed chat.
        text:
          type: string
          description: Churr Markdown.
          maxLength: 16000
        file_ids:
          type: array
          items:
            type: string
            format: uuid
          description: 'Files already uploaded to this conversation, in display order. Up to ten. In a sealed chat:
            the blobs the message carries, named outside the ciphertext so the server can tie them to it.'
          maxItems: 10
        parent_id:
          type: string
          format: uuid
          description: Reply in this message's thread. Naming a reply puts the new message in the same thread.
        quote:
          $ref: '#/components/schemas/Quote'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
          description: Bots only. Up to five.
          maxItems: 5
        form:
          $ref: '#/components/schemas/FormInput'
        sealed:
          $ref: '#/components/schemas/SealedPayload'
          description: Sealed chats only, and then the only content field allowed.
        quiet:
          type: boolean
          description: Sealed chats only. Must match the flag in the ciphertext's header.
        action:
          type: boolean
          description: The text says what the author is doing (`/me`). Needs text. In a sealed chat the mark goes
            inside the sealed content.
        chance:
          $ref: '#/components/schemas/ChanceInput'
          description: Have the server draw a result. The message then has no text, files, cards or form. People
            only; refused in a sealed chat.
        time_zone:
          type: string
          description: The author's IANA zone (`Europe/Berlin`), in which a date and time typed without a zone is
            read as an `instant` entity (ruling R69). Without it such text stays plain; a date and time typed with
            a zone resolves either way.
        instant_hints:
          type: array
          items:
            $ref: '#/components/schemas/InstantHint'
          description: Phrases the author made into instants in the composer. Up to 50 are read.
          maxItems: 50
        object_hints:
          type: array
          items:
            $ref: '#/components/schemas/ObjectHint'
          description: 'What the author chose for ranges of the text: plain text, or one kind of object. Up to 50
            are read.'
          maxItems: 50
    MessageEdit:
      type: object
      description: The new content of a message. Fields left out stay as they are.
      properties:
        text:
          type: string
        file_ids:
          type: array
          items:
            type: string
            format: uuid
          description: The files the message keeps or gains.
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
          description: Bots only.
        form:
          $ref: '#/components/schemas/FormInput'
          description: Refused with `conflict` once anyone has answered.
        sealed:
          $ref: '#/components/schemas/SealedPayload'
        time_zone:
          type: string
          description: As for a new message, for the new text. An edit that leaves the text alone keeps its instants.
        instant_hints:
          type: array
          items:
            $ref: '#/components/schemas/InstantHint'
          description: As for a new message, for the new text.
          maxItems: 50
        object_hints:
          type: array
          items:
            $ref: '#/components/schemas/ObjectHint'
          description: As for a new message, for the new text. An edit that leaves the text alone keeps its references.
          maxItems: 50
    MessageVersion:
      type: object
      description: An earlier version of a message, or the last content of a deleted one.
      required:
      - version
      - text
      - entities
      - cards
      - files
      - replaced_at
      - replaced_by_id
      - reason
      properties:
        version:
          type: integer
          format: int64
        text:
          type: string
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        replaced_at:
          type: string
          format: date-time
        replaced_by_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [edit, delete]
    TaskChange:
      type: object
      description: One tick or untick of a checklist item.
      required: [item_id, account_id, checked, at]
      properties:
        item_id:
          type: string
        account_id:
          type: string
          format: uuid
        checked:
          type: boolean
        at:
          type: string
          format: date-time
    ThreadState:
      type: object
      description: The caller's state for one thread. No row means "neither".
      required: [parent_id, conversation_id, state, read_seq, unread_count]
      properties:
        parent_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [following, ignored, none]
          description: '`none` ("neither") can appear in a response, as when a read position is kept for a thread
            the caller neither follows nor ignores.'
        read_seq:
          type: integer
          format: int64
          description: The caller's read position in the thread.
        unread_count:
          type: integer
          format: int64
    ThreadEntry:
      type: object
      description: A row of the Threads view.
      required: [thread_state, parent]
      properties:
        thread_state:
          $ref: '#/components/schemas/ThreadState'
        parent:
          $ref: '#/components/schemas/Message'
    Bookmark:
      type: object
      description: A message the caller saved for themselves.
      required: [message_id, created_at, message]
      properties:
        message_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        message:
          $ref: '#/components/schemas/Message'
    Emoji:
      type: object
      description: A custom emoji.
      required: [id, name, file_id, url, created_by_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        file_id:
          type: string
          format: uuid
        url:
          type: string
        created_by_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        server_name:
          type: string
          description: Set on an emoji that came with a shared channel. Written `:name@server.name:`.
    SearchResult:
      type: object
      description: One search hit.
      required: [message]
      properties:
        message:
          $ref: '#/components/schemas/Message'
        snippet:
          type: string
          description: A short plain-text excerpt around the match.
    Event:
      type: object
      description: An event as the live connection and catch-up carry it. The other fields depend on `type`; docs/EVENTS.md
        lists every type.
      required: [type, at]
      properties:
        type:
          type: string
          description: '`thing.happened`.'
        at:
          type: string
          format: date-time
        conversation_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
      additionalProperties: true
    Repeat:
      type: object
      description: When a scheduled item runs again.
      required: [every, at, time_zone]
      properties:
        every:
          type: string
          enum: [day, week, month]
        days:
          type: string
          pattern: ^[01]{7}$
          description: 'For `day`, and for `week` on chosen days: which days of the week, Monday first.'
        interval:
          type: integer
          format: int64
          description: 'For `week` with `days`: every this many weeks, 1 to 52, counted from the week of the first
            run after the rule is set or changed. Absent means 1.'
        day:
          type: integer
          format: int64
          description: 'For `month`: the day of the month, 1 to 31, or the month''s last day if it has no such day.'
        week:
          type: integer
          format: int64
          description: 'For `month`, with `weekday`: the nth such weekday of the month, 1 to 4, or -1 for the last.'
        weekday:
          type: integer
          format: int64
          description: 'For `month`, with `week`: 1 (Monday) to 7 (Sunday).'
        at:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        time_zone:
          type: string
          description: IANA name.
    ChatRequest:
      type: object
      description: 'A request for a new chat, as the person asked sees it: who is asking and for what kind of chat,
        nothing more (ruling R78).'
      required: [id, kind, account, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [direct, sealed]
          description: A direct chat or a sealed chat.
        account:
          $ref: '#/components/schemas/Account'
          description: Who is asking, as the caller is shown them.
        created_at:
          type: string
          format: date-time
    ScheduledItem:
      type: object
      description: A message to send later, a reminder, or a recurring form.
      required: [id, account_id, conversation_id, kind, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [message, reminder, form, watch]
          description: '`watch` is "tell me when this person is around" (ruling R76), made with `watchAccount`.'
        content:
          $ref: '#/components/schemas/MessageInput'
          description: Empty for a watch.
        about_message_id:
          type: string
          format: uuid
          description: For "remind me about this message". The delivered message quotes it.
        watch_account_id:
          type: string
          format: uuid
          description: 'For a watch: the person it waits for.'
        next_run_at:
          type: string
          format: date-time
          description: 'Absent when it has finished or failed. For a watch: when it expires unfired.'
        repeat:
          $ref: '#/components/schemas/Repeat'
        last_run_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
          description: Set when a run could not post. The content is kept so the owner can send it by hand or delete
            it.
        failure:
          type: string
          description: The error code of the failed run.
        created_at:
          type: string
          format: date-time
    ScheduledInput:
      type: object
      description: A new scheduled item. Give `run_at` for one run, `repeat` for a repeating one, or both to start
        repeating at a given time.
      required: [conversation_id, kind, content]
      properties:
        conversation_id:
          type: string
          format: uuid
          description: Where it is posted. A reminder to yourself goes to your own one-person channel; a reminder
            to a person goes to the ad-hoc channel with them.
        kind:
          type: string
          enum: [message, reminder, form]
        content:
          $ref: '#/components/schemas/MessageInput'
        about_message_id:
          type: string
          format: uuid
        run_at:
          type: string
          format: date-time
        repeat:
          $ref: '#/components/schemas/Repeat'
    SavedReply:
      type: object
      description: A `/name` command that posts preset text.
      required: [id, community, name, text, created_at]
      properties:
        id:
          type: string
          format: uuid
        community:
          type: boolean
          description: True for one an admin defined for everyone.
        name:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
    Command:
      type: object
      description: Something that can be typed as `/name` in a conversation.
      required: [name, kind, description]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [builtin, saved_reply, bot]
          description: Built-in commands are carried out by the client with ordinary API calls.
        description:
          type: string
        hint:
          type: string
          description: The argument hint.
        bot_id:
          type: string
          format: uuid
        saved_reply_id:
          type: string
          format: uuid
    Bot:
      type: object
      description: A bot account with what admins see about it.
      required: [account, description, created_by_id, webhook_only]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        description:
          type: string
        created_by_id:
          type: string
          format: uuid
        webhook_only:
          type: boolean
          description: The account behind a webhook.
        commands:
          type: array
          items:
            $ref: '#/components/schemas/Command'
        channel_ids:
          type: array
          items:
            type: string
            format: uuid
          description: The named channels the bot is in. Ad-hoc channels are never listed.
    Webhook:
      type: object
      description: A webhook, from request to revocation. The secret address is not part of this object.
      required:
      - id
      - conversation_id
      - bot_id
      - name
      - purpose
      - state
      - requested_by_id
      - requested_at
      - has_secret
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        bot_id:
          type: string
          format: uuid
        name:
          type: string
        purpose:
          type: string
        state:
          type: string
          enum: [waiting, approved, declined, revoked]
        requested_by_id:
          type: string
          format: uuid
        requested_at:
          type: string
          format: date-time
        decided_by_id:
          type: string
          format: uuid
        decided_at:
          type: string
          format: date-time
        has_secret:
          type: boolean
          description: The requester has collected the address. Until then the webhook cannot post.
        last_used_at:
          type: string
          format: date-time
    WebhookCard:
      description: A card as a webhook sends it. In place of file identifiers it gives addresses for the server
        to fetch, or names parts of a multipart request.
      allOf:
      - $ref: '#/components/schemas/Card'
      - type: object
        properties:
          image_url:
            type: string
            format: uri
          image_part:
            type: string
          author:
            type: object
            required: [name]
            properties:
              name:
                type: string
              icon_url:
                type: string
                format: uri
              icon_part:
                type: string
    WebhookMessage:
      type: object
      description: The body of `POST /hooks/{token}` (BOTS.md section 10). At least one of text, cards, form and
        files.
      properties:
        text:
          type: string
          description: Churr Markdown.
          maxLength: 16000
        cards:
          type: array
          items:
            $ref: '#/components/schemas/WebhookCard'
          description: Up to five.
          maxItems: 5
        form:
          $ref: '#/components/schemas/FormInput'
          description: 'Actions allowed: `tally`, `collect`, `thread`.'
        files:
          type: array
          maxItems: 10
          items:
            type: object
            required: [part]
            properties:
              part:
                type: string
                description: '`file1` to `file10`.'
              name:
                type: string
              caption:
                type: string
          description: Each names a part of a multipart request to attach as a file.
        parent_id:
          type: string
          format: uuid
          description: A top-level message in the webhook's channel.
        client_id:
          type: string
          format: uuid
        via:
          type: object
          properties:
            name:
              type: string
            icon_url:
              type: string
              format: uri
            icon_part:
              type: string
          description: 'How the message is labelled: "via *name*" beside the webhook''s own name.'
    InteractionResponse:
      type: object
      description: 'A bot''s response to an interaction: a command, a button press, or an answer to a `bot` form
        or dialog (BOTS.md section 5).'
      required: [type]
      properties:
        type:
          type: string
          enum: [message, private, dialog, none]
          description: '`message`: post `message` in the conversation for everyone. `private`: show `text` and `cards`
            to the asker only; not stored. `dialog`: show the asker `form` in a dialog. `none`: show nothing and
            tell the asker''s client to stop waiting.'
        message:
          $ref: '#/components/schemas/MessageInput'
          description: For `message`.
        text:
          type: string
          description: For `private`.
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
          description: For `private`. Up to five.
          maxItems: 5
        form:
          type: object
          required: [fields]
          properties:
            title:
              type: string
            fields:
              type: array
              items:
                $ref: '#/components/schemas/FormField'
            buttons:
              type: array
              items:
                $ref: '#/components/schemas/FormButton'
          description: For `dialog`. The action is always `bot`.
    Dialog:
      type: object
      description: A form shown to one person in a dialog. It is not a message and nobody else sees it.
      required: [id, bot_id, conversation_id, fields]
      properties:
        id:
          type: string
          format: uuid
          description: The dialog form's identifier.
        bot_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        title:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/FormButton'
    CallTrack:
      type: object
      description: One media track a participant is sending (CALLS.md).
      required: [id, source, kind, muted]
      properties:
        id:
          type: string
          description: Short, unique within the call, made by the server.
        source:
          type: string
          enum: [microphone, camera, screen]
        kind:
          type: string
          enum: [audio, video]
        muted:
          type: boolean
        codec:
          type: string
        layers:
          type: array
          items:
            type: string
        width:
          type: integer
          format: int64
        height:
          type: integer
          format: int64
    CallParticipant:
      type: object
      description: An account in a call.
      required: [account_id, joined_at]
      properties:
        account_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
          description: The device the account is in the call on. In a sealed chat's call it names whose call sender
            key decrypts the participant's frames (CALL-FRAMES.md). Absent when the session has no device, and for
            a participant another server relays. It changes if the call moves to the account's other device; `call.track_published`
            and `call.offer` name the device of each track.
        joined_at:
          type: string
          format: date-time
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/CallTrack'
          description: Present only in copies sent to participants.
    Call:
      type: object
      description: A call in a conversation. A conversation has one at most. CALLS.md describes it in full.
      required: [id, conversation_id, started_by_id, started_at, sealed, participants]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
          description: The system message for the call.
        started_by_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        sealed:
          type: boolean
          description: 'True in a sealed chat: media frames are encrypted on the devices with keys derived from
            the epoch secret.'
        hosted_by:
          type: string
          description: The name of the server carrying the media, when that is not this one.
        participants:
          type: array
          items:
            $ref: '#/components/schemas/CallParticipant'
    LiveCall:
      type: object
      description: 'A call in progress as the admin console shows it: how many people, not who.'
      required: [id, started_at, participant_count, camera_count]
      properties:
        id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        participant_count:
          type: integer
          format: int64
        camera_count:
          type: integer
          format: int64
        conversation_id:
          type: string
          format: uuid
          description: Only for a call in a public channel.
    DeviceListVersion:
      type: object
      description: One version of an account's signed device list. The server stores every version.
      required: [account_id, version, list, sig, created_at]
      properties:
        account_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          description: Starts at 1 and goes up by exactly one.
        list:
          type: string
          contentEncoding: base64url
          description: 'The exact bytes that were signed: the binary list record of SEALED.md section 4.3, in base64url.'
        sig:
          type: string
          contentEncoding: base64url
          description: By the list's own account key.
        prev_sig:
          type: string
          contentEncoding: base64url
          description: By the previous account key. Present only when the account key changed.
        created_at:
          type: string
          format: date-time
    DeviceListInput:
      type: object
      description: A new version of the caller's device list.
      required: [version, list, sig]
      properties:
        version:
          type: integer
          format: int64
        list:
          type: string
          contentEncoding: base64url
        sig:
          type: string
          contentEncoding: base64url
        prev_sig:
          type: string
          contentEncoding: base64url
    EpochRecord:
      type: object
      description: One key epoch of a sealed chat. The record is made and signed by one device and holds the epoch
        secret sealed separately to every device on both accounts' device lists, the device set, and the hash of
        the previous record. The server stores one per key epoch and cannot open it.
      required:
      - conversation_id
      - key_epoch
      - seq
      - account_id
      - device_id
      - record
      - created_at
      properties:
        conversation_id:
          type: string
          format: uuid
        key_epoch:
          type: integer
          format: int64
          description: A plain counter starting at 1.
        seq:
          type: integer
          format: int64
          description: Its place in the conversation's order.
        account_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
          description: The device that made it.
        record:
          type: string
          contentEncoding: base64url
        created_at:
          type: string
          format: date-time
    LockedCopy:
      type: object
      description: The backup key sealed to one way of unlocking.
      required: [id, kind, key_version, locked_key, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [passkey, phrase, device]
        passkey_id:
          type: string
          format: uuid
          description: For `passkey`.
        device_id:
          type: string
          format: uuid
          description: 'For `device`: sealed to that device''s box key.'
        key_version:
          type: integer
          format: int64
        locked_key:
          type: string
          contentEncoding: base64url
          description: The backup key sealed to that way's public key, with the account key's signature.
        created_at:
          type: string
          format: date-time
    LockedCopyInput:
      type: object
      description: A locked copy to store.
      required: [kind, key_version, locked_key]
      properties:
        kind:
          type: string
          enum: [passkey, phrase, device]
        passkey_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        key_version:
          type: integer
          format: int64
        locked_key:
          type: string
          contentEncoding: base64url
    AccountRecord:
      type: object
      description: The account key and the list of ways to unlock, encrypted under the backup key.
      required: [key_version, revision, record]
      properties:
        key_version:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
          description: Goes up by one each time the ways change.
        record:
          type: string
          contentEncoding: base64url
        updated_at:
          type: string
          format: date-time
    Backup:
      type: object
      description: What a complete session of an account is given to unlock sealed chats. The server can open none
        of it.
      required: [key_version, account_record, locked_copies, replacement_due]
      properties:
        key_version:
          type: integer
          format: int64
        account_record:
          $ref: '#/components/schemas/AccountRecord'
        locked_copies:
          type: array
          items:
            $ref: '#/components/schemas/LockedCopy'
        replacement_due:
          type: boolean
          description: A passkey or device was removed where no unlocked device was at hand. The next unlocked device
            replaces the backup key before anything else.
    BackupRecord:
      type: object
      description: A history secret for one sealed chat and one key epoch, encrypted under the backup key.
      required: [conversation_id, key_epoch, key_version, record]
      properties:
        conversation_id:
          type: string
          format: uuid
        key_epoch:
          type: integer
          format: int64
        key_version:
          type: integer
          format: int64
        record:
          type: string
          contentEncoding: base64url
        created_at:
          type: string
          format: date-time
    UnlockRequest:
      type: object
      description: A new, locked device asking an unlocked device of the same account for the backup key. Expires
        after ten minutes.
      required: [id, device_id, request, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        device:
          $ref: '#/components/schemas/Device'
        request:
          type: string
          contentEncoding: base64url
          description: The device's public keys and proof, as the device made them.
        answer:
          type: string
          contentEncoding: base64url
          description: The backup key sealed to the asking device's box key. Only the asking device is given it.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        answered_at:
          type: string
          format: date-time
    Settings:
      type: object
      description: Server settings, by the dotted keys of OPERATIONS.md section 5, with `auth.member_sign_in`, `auth.second_factor`
        and `auth.second_factor_accepted` for the sign-in policy. A read returns every key. A change sends any subset.
      properties:
        server.name:
          type: string
          description: The community's name.
        server.icon_file_id:
          type: [string, 'null']
          format: uuid
        server.time_zone:
          type: string
          description: IANA name used for an account that has none.
        welcome.text:
          type: string
          description: Churr Markdown shown to a new member on first sign-in.
        registration.mode:
          type: string
          enum: [open, invite, closed]
        invites.members_may_invite:
          type: boolean
        auth.member_sign_in:
          type: string
          enum: [passkey, either, sso]
        auth.second_factor:
          type: string
          enum: ['off', required]
        auth.second_factor_accepted:
          type: array
          items:
            type: string
            enum: [passkey, totp, provider]
        auth.allow_access_keys:
          type: boolean
          description: 'Allow accounts without a passkey: new access keys may be made. Off, existing access keys
            keep working. Default on.'
        sessions.passkey_seconds:
          type: integer
          format: int64
        sessions.sso_seconds:
          type: integer
          format: int64
        messages.quick_correction_seconds:
          type: integer
          format: int64
        messages.edit_window_seconds:
          type: [integer, 'null']
          description: Null is no limit.
        retention.seconds:
          type: [integer, 'null']
          description: Null keeps messages until deleted.
        mentions.broadcast_managers_only:
          type: boolean
        channels.large_channel_limit:
          type: integer
          format: int64
          description: A channel with more members than this is delivered in full only to the live connections that
            have it open; the others are told that it changed, at most once a second, and fetch the difference when
            it is opened. A channel can say otherwise (`lazy_delivery`). Default 1000. 0 delivers every channel
            in full to everyone.
        channels.large_feature_limit:
          type: integer
          format: int64
          description: A conversation with more members than this has no typing notices and no presence of single
            members; clients show an online count. Default 50. 0 is no limit.
        mentions.broad_mention_limit:
          type: integer
          format: int64
          description: In a channel with more members than this, only its managers and the admins may use `@channel`,
            `@here` and `@everyone`, unless the channel says otherwise. Default 250. 0 is no limit.
        emoji.members_may_add:
          type: boolean
        blocking.enabled:
          type: boolean
        webhooks.managers_may_approve:
          type: boolean
        files.max_bytes:
          type: integer
          format: int64
        files.store:
          type: string
          enum: [disk, s3]
        files.s3:
          type: [object, 'null']
          description: When the store is `s3`.
          properties:
            endpoint:
              type: string
            region:
              type: string
            bucket:
              type: string
            prefix:
              type: string
            path_style:
              type: boolean
            access_key_id:
              type: string
        files.s3_secret:
          type: string
          description: 'The secret access key. Write-only: never returned.'
          writeOnly: true
        files.s3_secret_set:
          type: boolean
          description: 'Read-only: a secret is stored.'
          readOnly: true
        push.relay_enabled:
          type: boolean
        push.relay_url:
          type: string
        push.unifiedpush_enabled:
          type: boolean
        push.send_badge:
          type: boolean
        previews.enabled:
          type: boolean
        sealed.enabled:
          type: boolean
          description: 'Off: no sealed chat can be started and existing ones become read-only.'
        calls.enabled:
          type: boolean
        calls.max_participants:
          type: integer
          format: int64
        calls.max_cameras:
          type: integer
          format: int64
        links.send_presence:
          type: boolean
        links.default_max_file_bytes:
          type: integer
          format: int64
    SsoProvider:
      type: object
      description: A company sign-in provider. Secrets are write-only.
      required: [id, kind, name, config, has_secret, enabled, callback_url, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [oidc, saml]
        name:
          type: string
        config:
          type: object
          additionalProperties: true
          description: 'OIDC: `issuer`, `client_id`, extra scopes, claim names, the `acr` values that count as multi-factor.
            SAML: entity ID, sign-on address, signing certificates, attribute names, the context values that count
            as multi-factor; or `metadata_xml` or `metadata_url`, loaded once.'
        has_secret:
          type: boolean
        group_claim:
          type: string
        admin_group:
          type: string
          description: A provider group that decides the admin role at each sign-in.
        enabled:
          type: boolean
        callback_url:
          type: string
          description: The fixed address on this server to register at the provider.
        created_at:
          type: string
          format: date-time
    SsoProviderInput:
      type: object
      description: Fields of a company sign-in provider.
      properties:
        kind:
          type: string
          enum: [oidc, saml]
        name:
          type: string
        config:
          type: object
          additionalProperties: true
        secret:
          type: string
          description: OIDC client secret. Stored sealed and never returned.
        group_claim:
          type: string
        admin_group:
          type: string
        enabled:
          type: boolean
    Invite:
      type: object
      description: An invite link.
      required:
      - id
      - code
      - url
      - role
      - group_ids
      - conversation_ids
      - max_uses
      - uses
      - created_at
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        url:
          type: string
          description: 'The link to hand out: `https://<server>/join/<code>`, the page where the person joins.'
        role:
          type: string
          enum: [member, guest]
        group_ids:
          type: array
          items:
            type: string
            format: uuid
        conversation_ids:
          type: array
          items:
            type: string
            format: uuid
          description: 'For guests: the channels they start in.'
        claims_account_id:
          type: string
          format: uuid
          description: The imported account this link claims.
        max_uses:
          type: integer
          format: int64
          description: 0 means no limit.
        uses:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time
        created_by_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    AdminAccount:
      description: An account with what admins see about it. Never its sessions.
      allOf:
      - $ref: '#/components/schemas/Account'
      - type: object
        required: [passkey_count, has_access_key, has_totp, provider_ids, banned]
        properties:
          passkey_count:
            type: integer
            format: int64
          has_access_key:
            type: boolean
            description: The account signs in with an access key. With no passkey it is one of the accounts without
              a passkey.
          has_totp:
            type: boolean
          provider_ids:
            type: array
            items:
              type: string
              format: uuid
            description: Providers the account has an identity at.
          last_seen_at:
            type: string
            format: date-time
          claimed_at:
            type: string
            format: date-time
          removed_by_id:
            type: string
            format: uuid
          banned:
            type: boolean
    Ban:
      type: object
      description: A ban on an account or a sign-in identity.
      required: [id, reason, created_by_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        subject:
          type: string
        reason:
          type: string
        created_by_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        lifted_at:
          type: string
          format: date-time
    ChannelBan:
      type: object
      description: An account banned from one channel (docs/FEATURES.md section 19.1).
      required: [id, conversation_id, account_id, reason, created_by_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        reason:
          type: string
        created_by_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Absent for a ban that lasts until it is lifted.
        lifted_at:
          type: string
          format: date-time
    ChannelBanInput:
      type: object
      description: A new channel ban.
      required: [account_id]
      properties:
        account_id:
          type: string
          format: uuid
        reason:
          type: string
          description: At most 1,000 characters.
        seconds:
          type: integer
          format: int64
          description: 'How long it lasts, 60 seconds to 366 days. Absent or 0: until it is lifted.'
    Knock:
      type: object
      description: A request to be added to a private channel (docs/FEATURES.md section 12.5, ruling R74).
      required: [id, conversation_id, account_id, created_at, outcome]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
          description: Who asked.
        created_at:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [pending, accepted, declined]
        answered_by_id:
          type: string
          format: uuid
          description: The manager who answered. Never sent to the one who asked.
        answered_at:
          type: string
          format: date-time
    Broadcast:
      type: object
      description: A notice from an admin to everyone connected (docs/FEATURES.md section 12.6, ruling R74). Not
        a message.
      required: [id, text, by_id, created_at, until]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          description: One line of plain text with the inline Markdown of messages, at most 500 characters.
        by_id:
          type: string
          format: uuid
          description: The admin who sent it.
        created_at:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
          description: When it stops showing. Clients hide it then by themselves; no event is sent.
    BroadcastInput:
      type: object
      description: A new server broadcast.
      required: [text]
      properties:
        text:
          type: string
          description: One line, 1 to 500 characters, plain text with the inline Markdown of messages.
        seconds:
          type: integer
          format: int64
          description: 'How long it shows, 60 to 86,400. Absent or 0: 600 (ten minutes).'
    AdminChannel:
      type: object
      description: What the admin console shows about a named channel. No content.
      required: [id, name, private, member_count, manager_ids, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Free-form and not unique.
          minLength: 1
          maxLength: 64
        private:
          type: boolean
        topic:
          type: string
          description: Public channels only.
        section_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          description: The channel it is a sub-channel of.
        retention_seconds:
          type: integer
          format: int64
        member_count:
          type: integer
          format: int64
        manager_ids:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        shared:
          type: boolean
        announcement:
          type: boolean
          description: 'An announcement channel: only its managers and the members they allow post.'
    Integration:
      type: object
      description: A credential for a program that works on the server as a whole.
      required: [id, name, allows, created_by_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        allows:
          type: array
          items:
            type: string
            enum: [availability]
          description: What it may do.
        created_by_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    WordFilter:
      type: object
      description: A word or pattern and what a match does.
      required: [id, pattern, is_regex, action, created_by_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        pattern:
          type: string
        is_regex:
          type: boolean
        action:
          type: string
          enum: [block, flag]
        created_by_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    PurgeRequest:
      type: object
      description: An author's request to purge their message in a public channel. Only admins are ever given this
        object with its outcome.
      required: [id, message_id, requested_by_id, requested_at]
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        requested_by_id:
          type: string
          format: uuid
        requested_at:
          type: string
          format: date-time
        decided_by_id:
          type: string
          format: uuid
        decided_at:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [shown, hidden, erased]
          description: Absent while waiting.
        message:
          $ref: '#/components/schemas/Message'
    KnownServer:
      type: object
      description: Another Churr server this one knows.
      required: [id, name, fingerprint, first_seen_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        fingerprint:
          type: string
          description: Fingerprint of its signing key, for people to compare.
        first_seen_at:
          type: string
          format: date-time
        blocked_at:
          type: string
          format: date-time
    Peer:
      type: object
      description: A link to one other server, or to a hub.
      required: [id, kind, dials, state, created_by_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [server, hub]
        name:
          type: string
          description: The other server's name, or the hub's. Absent on an invitation nobody has used yet.
        fingerprint:
          type: string
        dials:
          type: boolean
          description: This server dials out to the peer. The side that accepted the invitation dials.
        state:
          type: string
          enum: [invited, active, paused, removed]
        invite_expires_at:
          type: string
          format: date-time
        servers:
          type: array
          items:
            $ref: '#/components/schemas/KnownServer'
          description: 'For a hub: the servers reachable through it.'
        created_by_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        connected_at:
          type: string
          format: date-time
        last_error:
          type: string
        told_clock:
          $ref: '#/components/schemas/PeerClock'
          description: 'What the peer, as a time reference, has measured of this server''s clock and told it. This
            server stamps its events with it in every conversation the peer is the time reference of: every stream
            through a hub, and the streams the other server owns on a direct link. Absent until the peer has told
            one; kept while disconnected.'
        measured_clock:
          $ref: '#/components/schemas/PeerClock'
          description: 'On a direct link: what this server, as the time reference of the streams it owns, has measured
            of the other server''s clock. Absent for a hub, which does the measuring itself.'
    PeerClock:
      type: object
      description: What a time reference has measured of one server's clock and of the path between the two, in
        the link's own ping and pong. The reference is a hub, or the owner server on a direct link. A constant difference
        between the two directions of a path cannot be told from a clock offset; its effect on `offset_ms` is at
        most half of `latency_ms`, which is why `uncertainty_ms` is never less than that unless `synced`.
      required:
      - offset_ms
      - latency_ms
      - jitter_ms
      - uncertainty_ms
      - forward_ms
      - forward_jitter_ms
      - back_ms
      - back_jitter_ms
      - asymmetry_ms
      - samples
      - measured_at
      properties:
        offset_ms:
          type: integer
          format: int64
          description: The measured server's clock minus the reference's, as the reference applies it. May be negative.
        latency_ms:
          type: integer
          format: int64
          description: The lowest round trip among the recent samples.
        jitter_ms:
          type: integer
          format: int64
          description: The mean by which the recent round trips exceed the lowest.
        uncertainty_ms:
          type: integer
          format: int64
          description: A bound on the error of `offset_ms`.
        forward_ms:
          type: integer
          format: int64
          description: The lowest one-way time from the reference to the server among the recent samples, with the
            offset taken out.
        forward_jitter_ms:
          type: integer
          format: int64
          description: The mean by which that direction's samples exceed its lowest.
        back_ms:
          type: integer
          format: int64
          description: The lowest one-way time from the server to the reference, with the offset taken out.
        back_jitter_ms:
          type: integer
          format: int64
          description: The mean by which that direction's samples exceed its lowest.
        asymmetry_ms:
          type: integer
          format: int64
          description: An estimate of how much longer the forward direction takes than the back one, from a change
            seen in one direction only or, when `synced`, from the measured offset beyond 10 ms. 0 when nothing
            is known. May be negative.
        synced:
          type: boolean
          description: 'True when the reference''s operator has declared the clocks synchronised: `offset_ms` is
            then held within 10 ms and the rest of what was measured is in `asymmetry_ms`.'
        samples:
          type: integer
          format: int64
          description: How many samples the figures rest on, at most 16.
        measured_at:
          type: string
          format: date-time
          description: The reference's clock when the newest sample arrived.
    StreamServer:
      type: object
      description: A server in a stream.
      required: [server_id, name, state]
      properties:
        server_id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
          enum: [invited, active, removed]
        joined_at:
          type: string
          format: date-time
    Stream:
      type: object
      description: 'One conversation shared over a peer. Admin operations list only streams of kind `channel`: ad-hoc
        channels and sealed chats across servers are never shown to an owner.'
      required:
      - id
      - peer_id
      - reference
      - kind
      - state
      - key_epoch
      - history_days
      - servers
      - created_at
      properties:
        id:
          type: string
          format: uuid
        peer_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
          description: Absent until the offer is accepted here.
        owner_server:
          type: string
          description: Absent when this server owns the stream. For a channel on a hub, the hub's name.
        reference:
          type: string
          enum: [self, owner, hub]
          description: 'Who the stream''s time reference is: the party whose clock its events are stamped by and
            that keeps its log. The owner server on a direct link, the hub through a hub.'
        kind:
          type: string
          enum: [channel, adhoc, sealed]
        state:
          type: string
          enum: [offered, active, left, removed]
          description: '`offered`: waiting for this server''s owner, or for another server''s. `left`: this server
            left. `removed`: the owner removed this server or closed the stream.'
        key_epoch:
          type: integer
          format: int64
        offered_name:
          type: string
        offered_topic:
          type: string
        offered_at:
          type: string
          format: date-time
        offer_expires_at:
          type: string
          format: date-time
          description: An unanswered offer lapses after seven days.
        history_days:
          type: integer
          format: int64
          description: 0 to 90.
        max_blob_bytes:
          type: integer
          format: int64
          description: The largest file the stream carries. Set by the stream's owner.
        servers:
          type: array
          items:
            $ref: '#/components/schemas/StreamServer'
        created_at:
          type: string
          format: date-time
    HubModerator:
      type: object
      description: 'A moderator of a channel a hub owns: an account, and the server it belongs to.'
      required: [account_id, server, username]
      properties:
        account_id:
          type: string
          format: uuid
        server:
          type: string
        username:
          type: string
    HubChannel:
      type: object
      description: A hub's record of a channel it owns, as the hub last signed it.
      required:
      - stream_id
      - hub
      - version
      - name
      - description
      - listing
      - servers
      - moderators
      - invited
      - requests
      - key_maker
      - closed
      - updated_at
      properties:
        stream_id:
          type: string
          format: uuid
        hub:
          type: string
          description: The hub's name.
        version:
          type: integer
          format: int64
          description: Grows by one with every change the hub signs.
        name:
          type: string
        description:
          type: string
        listing:
          type: string
          enum: [unlisted, request, open]
          description: '`unlisted`: servers join only by a moderator''s invitation. `request`: every server on the
            hub sees it in the directory and may ask; a moderator approves. `open`: every server on the hub may
            join.'
        servers:
          type: array
          items:
            type: string
          description: The names of the servers in it, longest-standing first.
        moderators:
          type: array
          items:
            $ref: '#/components/schemas/HubModerator'
        invited:
          type: array
          items:
            type: string
          description: Servers invited and not yet in. Empty for a caller who is neither a moderator nor the owner.
        requests:
          type: array
          items:
            type: string
          description: Servers asking to join. Empty for a caller who is neither a moderator nor the owner.
        key_maker:
          type: string
          description: The server the hub named to make the current stream key. The hub never holds a key.
        closed:
          type: boolean
        updated_at:
          type: string
          format: date-time
    HubDirectoryEntry:
      type: object
      description: One channel in a hub's directory.
      required: [stream_id, name, description, listing, moderators, servers, state]
      properties:
        stream_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        listing:
          type: string
          enum: [request, open]
        moderators:
          type: array
          items:
            $ref: '#/components/schemas/HubModerator'
        servers:
          type: integer
          format: int64
          description: How many servers are in it.
        state:
          type: string
          enum: [none, invited, requested, member]
          description: This server's own place in it.
    StreamMove:
      type: object
      description: One attempt to move a channel shared over a direct link onto a hub, as this server knows it.
      required:
      - id
      - stream_id
      - direction
      - other_server
      - hub_name
      - hub_fingerprint
      - state
      - created_at
      - expires_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        stream_id:
          type: string
          format: uuid
        direction:
          type: string
          enum: [outgoing, incoming]
          description: '`outgoing`: this server proposed it. `incoming`: the other server did.'
        other_server:
          type: string
        hub_name:
          type: string
        hub_fingerprint:
          type: string
        hub_peer_id:
          type: string
          format: uuid
          description: This server's own link to that hub. Absent if it has none, in which case it cannot accept.
        state:
          type: string
          enum: [proposed, accepted, committed, done, declined, abandoned]
          description: '`committed`: the hand-over has happened and is being finished. `done`: both servers and
            the hub agree it has. `abandoned`: nothing changed, and `reason` says why.'
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuditEntry:
      type: object
      description: One line of the audit log.
      required: [id, at, actor_kind, action, detail]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actor_id:
          type: string
          format: uuid
          description: An account or an integration. Absent for the server itself.
        actor_kind:
          type: string
          enum: [account, integration, server, cli]
        action:
          type: string
          description: For example `account.removed`, `setting.changed`.
        target_kind:
          type: string
        target_id:
          type: string
        detail:
          type: object
          additionalProperties: true
    Export:
      type: object
      description: A full export of the community's data. Sealed chats are never in it.
      required: [id, state, started_by_id, started_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [running, ready, failed]
        started_by_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
          description: Bytes.
        error:
          type: string
    OutsideConnection:
      type: object
      description: One of the outside connections a server can make, and how it is doing.
      required: [name, enabled, state]
      properties:
        name:
          type: string
          enum:
          - certificate
          - push_relay
          - unifiedpush
          - link_previews
          - object_storage
          - identity_provider
          - peers
        enabled:
          type: boolean
        state:
          type: string
          enum: [ok, failing, 'off']
        last_ok_at:
          type: string
          format: date-time
        last_error:
          type: string
    Overview:
      type: object
      description: What the admin console's Overview page shows.
      required:
      - version
      - started_at
      - uptime_seconds
      - database
      - files
      - accounts
      - members_online
      - connections
      - live_calls
      - outside
      - peers
      - outbox
      - waiting
      - warnings
      properties:
        version:
          type: string
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          format: int64
        database:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [sqlite, postgres]
            size:
              type: integer
              format: int64
              description: Bytes.
        files:
          type: object
          required: [store, count, size]
          properties:
            store:
              type: string
              enum: [disk, s3]
            count:
              type: integer
              format: int64
            size:
              type: integer
              format: int64
              description: Bytes.
        accounts:
          type: object
          required: [people, guests, bots, remote, without_passkey]
          properties:
            people:
              type: integer
              format: int64
            guests:
              type: integer
              format: int64
            bots:
              type: integer
              format: int64
            remote:
              type: integer
              format: int64
            without_passkey:
              type: integer
              format: int64
              description: People and guests who sign in with an access key and have no passkey.
        members_online:
          type: integer
          format: int64
        connections:
          type: integer
          format: int64
          description: Live connections open now.
        live_calls:
          type: integer
          format: int64
        media_address:
          type: string
          description: The address and port call media uses.
        outside:
          type: array
          items:
            $ref: '#/components/schemas/OutsideConnection'
        peers:
          type: array
          items:
            $ref: '#/components/schemas/Peer'
        outbox:
          type: integer
          format: int64
          description: Events waiting for a peer.
        janitor_last_run_at:
          type: string
          format: date-time
        waiting:
          type: object
          required: [webhooks, reports, purge_requests]
          properties:
            webhooks:
              type: integer
              format: int64
            reports:
              type: integer
              format: int64
            purge_requests:
              type: integer
              format: int64
          description: Queues that need an admin.
        warnings:
          type: array
          items:
            type: string
          description: 'Plain sentences: a certificate near expiry, a failing peer, a media port that looks closed.'
    CardTheme:
      type: object
      description: A copy of a theme as a theme card or a server default carries it.
      required: [id, name, kind, colours, author_id]
      properties:
        id:
          type: string
          format: uuid
          description: The theme it was copied from. It may since have changed or gone.
        name:
          type: string
        kind:
          type: string
          enum: [dark, light]
        colours:
          $ref: '#/components/schemas/ThemeColours'
        author_id:
          type: string
          format: uuid
          description: Who owned the theme.
    ThemeColours:
      type: object
      description: 'The base colours of a theme (docs/STYLE.md, "Themes"): exactly these nine, each six hex digits.
        Every other colour is derived from them by the rules there.'
      required: [bg, panel, raise, ink, dim, lav, cyan, pink, yel]
      properties:
        bg:
          type: string
          description: 'Ground: page, message log, inputs.'
          pattern: ^#[0-9a-fA-F]{6}$
        panel:
          type: string
          description: 'Panel: sidebar, cards, headers.'
          pattern: ^#[0-9a-fA-F]{6}$
        raise:
          type: string
          description: 'Raised: hover, selected, code.'
          pattern: ^#[0-9a-fA-F]{6}$
        ink:
          type: string
          description: Text.
          pattern: ^#[0-9a-fA-F]{6}$
        dim:
          type: string
          description: Secondary text, icons.
          pattern: ^#[0-9a-fA-F]{6}$
        lav:
          type: string
          description: 'Lavender: the brand and yours.'
          pattern: ^#[0-9a-fA-F]{6}$
        cyan:
          type: string
          description: 'Cyan: live and go.'
          pattern: ^#[0-9a-fA-F]{6}$
        pink:
          type: string
          description: 'Pink: wants attention.'
          pattern: ^#[0-9a-fA-F]{6}$
        yel:
          type: string
          description: 'Yellow: counts and points, as a fill.'
          pattern: ^#[0-9a-fA-F]{6}$
    Theme:
      type: object
      description: A colour theme (ruling R61). Its link is `{origin}/themes/{id}`.
      required: [id, owner_id, name, kind, colours, published, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
          description: 1 to 64 characters.
        kind:
          type: string
          enum: [dark, light]
        colours:
          $ref: '#/components/schemas/ThemeColours'
        published:
          type: boolean
          description: In the server's theme library.
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ThemeInput:
      type: object
      description: A theme as it is saved. On create every field is required; on change absent ones stay. The server
        refuses with `invalid_value` a theme whose derived text pairings fall below 4.5:1 or control-edge pairings
        below 3:1, naming the pairing and its measured ratio ("dim on raise is 4.06:1; text needs at least 4.5:1."),
        and a dark theme whose ground is lighter than its ink or a light one the other way round (`kind`).
      properties:
        name:
          type: string
          description: 1 to 64 characters.
        kind:
          type: string
          enum: [dark, light]
        colours:
          $ref: '#/components/schemas/ThemeColours'
    DefaultThemes:
      type: object
      description: 'The server''s default themes. Absent: none set.'
      properties:
        dark:
          $ref: '#/components/schemas/CardTheme'
        light:
          $ref: '#/components/schemas/CardTheme'
