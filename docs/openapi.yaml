      summary: Catch up on a conversation's events
      description: |-
        **Who:** Any account that can read the conversation: its members, and for a public channel every owner, admin and member.

        Events with `seq` greater than `after`, oldest first, up to `until` if given, so a client can fill one gap. Events are kept for 30 days. If `after` is older than what is kept, `reload` is true and `events` is empty: the client drops what it holds for the conversation and loads it again. In a shared conversation some numbers may be missing.
