      summary: Find or create the sealed chat with one person
      description: |-
        **Who:** Owner, admin and member, with a person they can see. Guests, with a person already in a conversation with them. Never bots, on either side. A remote account only while it shares a shared channel with the caller.

        There is one sealed chat per pair. If it exists it is returned with 200 and the record sent is ignored. Otherwise it is created with 201, and `epoch_record` becomes its epoch record 1, so the chat can be written in at once. The record is sealed to every device on both accounts' current device lists; if the other person has no device list yet, to the caller's own devices, and the other person's first device starts a new epoch when it arrives. Epoch record 1 carries the new conversation's identifier under its maker's signature, so the creating device makes that identifier itself, a UUIDv7, and puts it in the record: the one exception to the server making every identifier. A record that is missing or not in its one valid form, that does not name a UUIDv7, or whose identifier is already in use, is refused with `invalid_value` on field `epoch_record`. For an account on another server the answer may be `unavailable` while the link to its server is down. A person of this server who does not approve new sealed chats automatically (`auto_approve_sealed`) is asked first, as `openChat` describes: the chat waits with epoch record 1 until they accept. A chat that was closed is not found again: a new one is made, with a new identifier and a new epoch record 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, epoch_record]
              properties:
                account_id:
                  type: string
                  format: uuid
                epoch_record:
                  type: string
                  contentEncoding: base64url
                  description: Epoch record 1, naming the new chat's identifier. Ignored if the chat exists.
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.OpenSealedChatRequest
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.OpenSealedChatResponse
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
