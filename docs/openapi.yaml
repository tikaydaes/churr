  /oauth/authorize:
    get:
      operationId: authorize
      tags: [OAuth]
      summary: Open the sign-in and approval page for an app
      description: |-
        **Who:** A person in a browser. They sign in by any method the server offers, then approve the app.

        Checks the redirect address and PKCE values before anything else and never redirects to an address it has not accepted: `http://127.0.0.1:<port>/…` or `http://[::1]:<port>/…` for desktop apps, or the apps' own address scheme for phones. The person signs in if the browser has no complete session, second factor included, and approves "Sign in <device name> as <username>?". The browser is then sent to the redirect address with `code`, `state` and `iss`. A browser session made only for this is revoked once the code is issued. The approval itself is a form post from this page to `POST /oauth/authorize`, which is not an operation of this contract; when the page is an unlocked web chat it may add `handover`, the backup key sealed to the app's box key (SEALED.md section 13.3), which the server keeps with the code and cannot open.
      parameters:
      - name: response_type
        in: query
        required: true
        description: Always `code`.
        schema:
          type: string
          enum: [code]
      - name: client_id
        in: query
        required: true
        description: A label such as `churr-app`. Apps are not registered and it is given no trust.
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        description: Where to send the code.
        schema:
          type: string
      - name: code_challenge
        in: query
        required: true
        description: PKCE challenge, at least 43 characters.
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: true
        description: Always `S256`.
        schema:
          type: string
          enum: [S256]
      - name: state
        in: query
        description: Returned unchanged.
        schema:
          type: string
      - name: device_name
        in: query
        description: Shown on the approval page and kept as the session label.
        schema:
          type: string
      - name: platform
        in: query
        description: The app's platform.
        schema:
          type: string
          enum: [android, ios, macos, windows, linux]
      - name: box_key
        in: query
        description: The app's device box public key, base64url. With it, a passkey sign-in on this page also hands
          the app the backup key.
        schema:
          type: string
      security:
      - {}
      - session_cookie: []
      - bearer_token: []
      responses:
        '200':
          description: The sign-in and approval page.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes: [invalid_request, invalid_value, rate_limited, internal]
