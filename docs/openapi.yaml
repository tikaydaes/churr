      tags: [Messages]
      summary: List messages in a conversation
      description: |-
        **Who:** Any account that can read the conversation: its members, and for a public channel every owner, admin and member.

        A page is cut, and paged through, by `seq`, and comes in `seq` order. Replies are included among top-level messages unless `top_level` is true. `thread_states` holds the caller's state for the threads in the page; it is never inside the message object. A client shows what it has loaded sorted by `order`, not in the order of the page. In a conversation that is not shared the two are the same. In one shared with other servers a message that arrived late has a high `seq` and an early `order`: it is in the newest page, marked `late`, and belongs further up.
