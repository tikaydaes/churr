      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token, 'urn:churr:params:oauth:grant-type:pairing-code']
                code:
                  type: string
                code_verifier:
                  type: string
                redirect_uri:
                  type: string
                client_id:
                  type: string
                refresh_token:
                  type: string
                pairing_code:
                  type: string
                device_name:
                  type: string
                platform:
                  type: string
                  enum: [android, ios, macos, windows, linux]
