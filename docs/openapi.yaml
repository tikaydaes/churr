  /api/v1/conversations/{id}/commands:
    post:
      operationId: runCommand
      tags: [Commands]
      summary: Run a bot command or a saved reply
      description: |-
        **Who:** Any local member of the conversation, at any level. Not while timed out.

        The server looks the name up in this order and stops at the first match: the caller's own saved replies, custom commands, then commands of bots in this conversation. No match is `not_found`. A saved reply or custom command is posted as a message from the caller, who must be allowed to post; text after its name is refused with `invalid_value`. A bot command posts nothing: the server makes an interaction, sends the bot `command.invoked`, and returns the `interaction_id` at once; a bot that is not connected gives `unavailable`. Built-in commands are carried out by the client with ordinary calls and are refused here with `invalid_value`; so is a protected built-in's name even where an older saved reply or bot command has it.
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                text:
                  type: string
                  description: What was typed after the name. Up to 4,000 characters.
                parent_id:
                  type: string
                  format: uuid
                  description: When typed in a thread.
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.RunCommandRequest
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  interaction_id:
                    type: string
                    format: uuid
                    description: For a bot command.
                  message:
                    $ref: '#/components/schemas/Message'
                    description: For a saved reply.
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.RunCommandResponse
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 'Codes: `unauthenticated`, `second_factor_required`, `session_locked`.'
        '403':
