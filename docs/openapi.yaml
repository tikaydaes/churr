  /api/v1/conversations/{id}/sealed/epochs:
    post:
      operationId: postEpochRecord
      tags: [Sealed chats]
      summary: Post the next epoch record of a sealed chat
      description: |-
        **Who:** Either person in the sealed chat, from a device that is in its account's device list.

        An epoch record starts a new key epoch: one device makes a fresh epoch secret, seals it separately to every device on both accounts' current device lists, and signs the record. The server cannot open it. It accepts exactly one record per `key_epoch`, and only the next number; it gives the record a `seq`, keeps it as long as the chat, makes that key epoch the current one, and delivers `sealed.epoch_started` to both accounts' devices. A second record for the same `key_epoch` is refused with `conflict`, and the answer carries the winning record beside the error so the device can use it. A device makes a new epoch when either account's device list changes, when it has just been unlocked and must include itself, and when the current epoch is more than seven days old at the time someone sends.
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_epoch, record]
              properties:
                key_epoch:
                  type: integer
                  format: int64
                  description: One above the chat's current key epoch.
                record:
                  type: string
                  contentEncoding: base64url
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.PostEpochRecordRequest
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [epoch]
                properties:
                  epoch:
                    $ref: '#/components/schemas/EpochRecord'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.PostEpochRecordResponse
        '409':
          description: 'Codes: `conflict`. Another record already holds this key epoch. `epoch` is that record.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  required: [epoch]
                  properties:
                    epoch:
                      $ref: '#/components/schemas/EpochRecord'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.PostEpochRecordResponse409
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 'Codes: `unauthenticated`, `second_factor_required`, `session_locked`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Codes: `forbidden`, `feature_off`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'Codes: `not_found`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Codes: `rate_limited`.'
        '500':
          $ref: '#/components/responses/ServerError'
          description: 'Codes: `internal`.'
      x-error-codes:
      - invalid_request
      - invalid_value
      - unauthenticated
      - second_factor_required
      - session_locked
      - forbidden
      - feature_off
      - not_found
      - conflict
      - rate_limited
      - internal
