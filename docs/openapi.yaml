  /api/v1/messages/{id}/move-to-channel:
    post:
      operationId: moveThreadToChannel
      tags: [Messages]
      summary: Move a thread out into a channel of its own
      description: |-
        **Who:** The author of the thread's parent message, at level `member` or above and with a role that may create channels; or an account acting as manager of the channel. Not in a shared channel, a sealed chat or an archived channel.

        The replies are moved, not copied, and the move is not undone. The parent stays in the old channel untouched; a copy of it is the new channel's first message, and the replies become top-level messages after it. The new channel is private if the old one was, and is a sub-channel of the channel the thread was in, or, if that channel is itself a sub-channel, a sibling under the same parent. Its name need not be unique. The thread's followers become its members and anyone else in the old channel can join it. In the old channel a system reply of kind `thread_moved` under the parent points to the new channel, and the old thread accepts no more replies. A message that is a reply, a system notice or has no replies is refused with `invalid_request`; a thread already moved with `conflict`.
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: 'A channel name: 1 to 64 characters of any script. Spaces and capitals are allowed;
                    no control characters, no leading or trailing space, and runs of spaces are collapsed to one.
                    Not unique.'
                  minLength: 1
                  maxLength: 64
          application/x-protobuf:
            schema:
              type: string
              format: binary
            x-protobuf-message: churr.v1.MoveThreadToChannelRequest
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
            application/x-protobuf:
              schema:
                type: string
                format: binary
              x-protobuf-message: churr.v1.MoveThreadToChannelResponse
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Codes: `invalid_request`, `invalid_value`.'
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 'Codes: `unauthenticated`, `second_factor_required`, `session_locked`.'
        '403':
