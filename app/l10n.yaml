# Flutter's localisation (docs/CLIENTS.md section 11, "Language").
# `flutter gen-l10n` (run by `flutter pub get` and every build) turns
# lib/l10n/app_en.arb into lib/l10n/app_localizations*.dart.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: L10n
nullable-getter: false
